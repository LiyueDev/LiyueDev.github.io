<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a2130" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#1a2130" />
<title>把风递给花瓣</title>
<meta name="description" content="一棵像素画的海棠。摇一下，或者放一阵风过去，看花瓣松手。liyue 作。" />
<meta property="og:title" content="把风递给花瓣" />
<meta property="og:description" content="一棵像素海棠，和一场可以自己调的风。" />
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#F5F5FF}
.pp-frame{
  --scene-w:320px;--scene-h:280px;
  --pp-bg:#1a2130;--pp-bg-2:#161c28;
  --pp-surface:#273246;--pp-surface-2:#222c3e;
  --pp-edge:#3a475f;--pp-edge-strong:#4b5a76;
  --pp-ink:#edf2fa;--pp-subtle:#a3b1c8;--pp-faint:#78869e;
  --pp-well:#222c3e;--pp-chip:#34425c;
  --pp-chip-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(106,155,255,.16);
  --pp-rail:#3a475f;--pp-fill:#6a9bff;--pp-fill-2:#85aeff;
  --pp-stop:#4b5a76;--pp-thumb:#edf2fa;
  --pp-switch:#34425c;--pp-on:#6a9bff;--pp-on-2:#4c82f0;
  --pp-sep:rgba(163,177,200,.14);--pp-focus:rgba(106,155,255,.55);
  --pp-icon-tile:#222c3e;
  --pp-cta:#6a9bff;--pp-cta-2:#4c82f0;--pp-cta-ink:#0d1a33;
  --pp-cta-shadow:0 14px 34px -14px rgba(47,107,238,.7),0 2px 8px -3px rgba(47,107,238,.35);
  --pp-shadow:0 22px 60px -24px rgba(0,0,0,.62),0 10px 28px -12px rgba(0,0,0,.42);
  --pp-glow:rgba(106,155,255,.07);
  --pp-geo-line:rgba(122,168,255,.20);--pp-geo-line-2:rgba(122,168,255,.075);
  --pp-geo-grid:96px;--pp-geo-disc:rgba(106,155,255,.055);
  color-scheme:dark;
  position:fixed;inset:0;z-index:40;
  display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto;
  justify-items:center;gap:16px;
  padding:16px 24px max(16px,env(safe-area-inset-bottom));
  overflow:hidden;overscroll-behavior:none;
  background:var(--pp-bg);
  color:var(--pp-ink);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","HarmonyOS Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.pp-frame[data-theme=light]{
  color-scheme:light;
  --pp-bg:#f5f5ff;--pp-bg-2:#f5f5ff;
  --pp-surface:#ffffff;--pp-surface-2:#f8fafe;
  --pp-edge:#d8e3f5;--pp-edge-strong:#c3d3ee;
  --pp-ink:#161c28;--pp-subtle:#5f6570;--pp-faint:#8a919f;
  --pp-well:#f2f6fd;--pp-chip:#ffffff;
  --pp-chip-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 1px rgba(47,107,238,.22),0 2px 8px -3px rgba(47,107,238,.16);
  --pp-rail:#d8e3f5;--pp-fill:#2f6bee;--pp-fill-2:#2359d6;
  --pp-stop:#c3d3ee;--pp-thumb:#ffffff;
  --pp-switch:#d8e3f5;--pp-on:#2f6bee;--pp-on-2:#2359d6;
  --pp-sep:rgba(22,28,40,.08);--pp-focus:rgba(47,107,238,.5);
  --pp-icon-tile:#f2f6fd;
  --pp-cta:#2f6bee;--pp-cta-2:#2359d6;--pp-cta-ink:#ffffff;
  --pp-cta-shadow:0 14px 34px -14px rgba(47,107,238,.5),0 2px 8px -3px rgba(47,107,238,.28);
  --pp-shadow:0 22px 60px -24px rgba(22,28,40,.28),0 10px 28px -12px rgba(47,107,238,.2);
  --pp-glow:rgba(47,107,238,.05);
  --pp-geo-line:rgba(47,107,238,.145);--pp-geo-line-2:rgba(47,107,238,.07);
  --pp-geo-grid:96px;--pp-geo-disc:rgba(47,107,238,.045);
  color-scheme:light;
}

/* ---------- 背景一层 ---------- */
.pp-back{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;-webkit-user-select:none;user-select:none}

/* ---------- 背景二层：网格与几何线稿 ---------- */
.pp-grid{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(to right,var(--pp-geo-line-2) 1px,transparent 1px),
    linear-gradient(to bottom,var(--pp-geo-line-2) 1px,transparent 1px);
  background-size:var(--pp-geo-grid) var(--pp-geo-grid);background-position:center;
  -webkit-mask-image:linear-gradient(to bottom,transparent 2%,#000 16%,#000 84%,transparent 99%);
  mask-image:linear-gradient(to bottom,transparent 2%,#000 16%,#000 84%,transparent 99%);
  transition:opacity .42s cubic-bezier(.22,.61,.36,1);
}
.pp-geo{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;transition:opacity .42s cubic-bezier(.22,.61,.36,1)}
.pp-geo span{position:absolute;display:block}
.pp-geo .g-frame{inset:7% 6%;border:1px solid var(--pp-geo-line-2)}
.pp-geo .g-disc{left:50%;top:50%;width:min(46vmin,440px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--pp-geo-disc)}
.pp-geo .g-ring{left:50%;top:50%;width:min(62vmin,600px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid var(--pp-geo-line);border-radius:50%}
.pp-geo .g-ring2{left:50%;top:50%;width:min(30vmin,286px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid var(--pp-geo-line-2);border-radius:50%}
.pp-geo .g-base{left:6%;right:6%;top:var(--pp-base,74%);height:1px;background:var(--pp-geo-line)}
.pp-geo .g-vert{left:50%;top:10%;bottom:10%;width:1px;background:var(--pp-geo-line-2);opacity:.7}
.pp-geo .g-tick{width:1px;height:16px;background:var(--pp-geo-line)}
.pp-geo .g-tick-a{left:6%;bottom:16%}
.pp-geo .g-tick-b{right:6%;bottom:16%}
.pp-frame[data-bg="sea"] .pp-grid,
.pp-frame[data-bg="sea"] .pp-geo{opacity:0}
/* 嵌进作品卡预览：只留网格和那条基准线，别把圆环的半截露在卡片边上 */
.pp-frame[data-embed="true"] .pp-geo .g-frame,
.pp-frame[data-embed="true"] .pp-geo .g-ring,
.pp-frame[data-embed="true"] .pp-geo .g-ring2,
.pp-frame[data-embed="true"] .pp-geo .g-vert,
.pp-frame[data-embed="true"] .pp-geo .g-tick{display:none}

/* ---------- 顶栏 ---------- */
.pp-top{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;min-height:44px}
.pp-top-start,.pp-top-end{display:flex;align-items:center;gap:10px}
.pp-top-start{justify-self:start}
.pp-top-end{justify-self:end}
.pp-icon{display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--pp-subtle);cursor:pointer;transition:color .2s cubic-bezier(.22,.61,.36,1),background .2s cubic-bezier(.22,.61,.36,1),transform .18s cubic-bezier(.22,.61,.36,1);font:inherit}
.pp-icon:hover{color:var(--pp-ink);background:var(--pp-icon-tile);box-shadow:inset 0 0 0 1px var(--pp-edge)}
.pp-icon:active{transform:scale(.94)}
.pp-icon.is-on{color:var(--pp-ink);background:var(--pp-icon-tile);box-shadow:inset 0 0 0 1px var(--pp-edge)}
.pp-icon:focus-visible,.pp-seg button:focus-visible,.pp-switch-row:focus-visible,.pp-info:focus-visible,.pp-track:focus-visible,.wt-grow:focus-visible{outline:2px solid var(--pp-focus);outline-offset:2px}

.wt-heading{position:relative;display:flex;align-items:center;gap:4px}
.wt-copy{display:grid;justify-items:center;gap:4px}
/* 画面上不写字，标题只留在 <title> 里，顶栏中间只留那个信息键 */
.wt-heading .wt-copy{display:none}
.wt-title{margin:0;font-size:19px;line-height:23px;font-weight:700;letter-spacing:-.03em}
.wt-sub{margin:0;font-size:9px;line-height:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--pp-faint)}
.pp-info{display:grid;place-items:center;width:30px;height:30px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--pp-subtle);cursor:pointer;transition:color .2s cubic-bezier(.22,.61,.36,1),background .2s cubic-bezier(.22,.61,.36,1);margin-left:-4px}
.pp-info:hover,.pp-info[aria-expanded=true]{color:var(--pp-ink);background:var(--pp-icon-tile)}
.wt-sign{display:block;padding:4px;border-radius:10px;transition:background .2s cubic-bezier(.22,.61,.36,1),opacity .2s ease;opacity:.8}
.wt-sign img{display:block;height:24px;width:auto}
.wt-sign:hover{background:var(--pp-icon-tile);opacity:1}

/* ---------- 说明卡 ---------- */
.pp-about{position:absolute;top:calc(100% + 12px);left:50%;z-index:50;width:min(352px,calc(100vw - 24px));padding:18px;border-radius:16px;background:var(--pp-surface);box-shadow:0 0 0 1px var(--pp-edge),var(--pp-shadow);transform:translate(-50%);transform-origin:top center;animation:pp-bloom .24s cubic-bezier(.22,.61,.36,1);-webkit-user-select:text;user-select:text}
.pp-about[hidden]{display:none}
.pp-about-list{display:grid;gap:16px;margin:0;padding:0;list-style:none}
.pp-about-list li{display:grid;grid-template-columns:42px 1fr;align-items:center;gap:12px}
.pp-about-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:var(--pp-icon-tile);box-shadow:inset 0 0 0 1px var(--pp-edge);overflow:hidden}
.pp-about-icon canvas{width:32px;height:32px;image-rendering:pixelated}
.pp-about-copy{display:grid;gap:3px}
.pp-about-name{font-size:13.5px;line-height:18px;font-weight:600}
.pp-about-text{color:var(--pp-subtle);font-size:12.5px;line-height:19px}

/* ---------- 场景 ---------- */
.pp-stage{position:relative;z-index:1;display:grid;place-items:center;width:100%;min-width:0;min-height:0;overflow:hidden}
.pp-scene{position:absolute;z-index:2;display:block;image-rendering:pixelated;outline:none;touch-action:manipulation}
.pp-scene[data-over=plant]{cursor:pointer}
.pp-scene[data-over=grab]{cursor:grabbing}
.pp-scene:focus,.pp-scene:focus-visible{outline:none}

.wt-grow{position:absolute;left:50%;bottom:10px;z-index:6;transform:translateX(-50%);
  min-height:38px;padding:0 20px;border:0;border-radius:999px;
  background:linear-gradient(180deg,var(--pp-cta),var(--pp-cta-2));color:var(--pp-cta-ink);box-shadow:var(--pp-cta-shadow);
  font-family:inherit;font-size:13.5px;line-height:20px;font-weight:600;letter-spacing:.01em;cursor:pointer;
  animation:pp-pop .32s cubic-bezier(.22,.61,.36,1);transition:transform .18s cubic-bezier(.22,.61,.36,1),opacity .2s ease,filter .2s ease}
.wt-grow:hover{filter:brightness(1.06)}
.wt-grow:active{transform:translateX(-50%) scale(.96)}
.wt-grow[hidden]{display:none}

/* ---------- 工作台：浮在场景底部，开合不改舞台尺寸，树不会跟着往上跳 ---------- */
.pp-dock-wrap{position:absolute;left:50%;bottom:14px;z-index:6;width:max-content;max-width:calc(100% - 28px);margin:0;border-radius:18px;max-height:0;overflow:hidden;opacity:0;pointer-events:none;transform:translate(-50%,7px);
  transition:max-height .42s cubic-bezier(.22,.61,.36,1),opacity .26s cubic-bezier(.22,.61,.36,1),transform .42s cubic-bezier(.22,.61,.36,1)}
.pp-dock-wrap[data-open=true]{max-height:340px;opacity:1;pointer-events:auto;transform:translate(-50%,0);box-shadow:var(--pp-shadow)}
.pp-dock{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:14px 30px;max-width:100%;margin:0;padding:16px 26px 18px;border-radius:18px;background:linear-gradient(180deg,var(--pp-surface) 0%,var(--pp-surface-2) 100%);box-shadow:0 0 0 1px var(--pp-edge)}
.pp-group{display:flex;align-items:flex-end;gap:30px}
.pp-field{display:grid;gap:8px}
.pp-label{display:flex;justify-content:space-between;gap:12px;color:var(--pp-subtle);font-size:12px;line-height:16px;font-weight:400;letter-spacing:.03em}
.pp-value{color:var(--pp-ink);font-weight:600;font-size:13px;letter-spacing:-.01em}
.pp-value.swap{animation:pp-swap .18s cubic-bezier(.22,.61,.36,1)}
.pp-sep{align-self:stretch;width:1px;margin-block:2px;background:var(--pp-sep)}
.pp-windsock{display:none}
.pp-seg{display:inline-flex;height:40px;padding:3px;border-radius:999px;background:var(--pp-well);box-shadow:inset 0 0 0 1px var(--pp-edge)}
.pp-seg button{min-width:62px;padding:0 15px;border:0;border-radius:999px;background:transparent;color:var(--pp-subtle);font-family:inherit;font-size:13px;line-height:18px;font-weight:500;cursor:pointer;transition:background .2s cubic-bezier(.22,.61,.36,1),color .2s cubic-bezier(.22,.61,.36,1),box-shadow .2s cubic-bezier(.22,.61,.36,1)}
.pp-seg button[aria-checked=true],.pp-seg button[aria-pressed=true]{background:var(--pp-chip);color:var(--pp-ink);font-weight:600;box-shadow:var(--pp-chip-shadow)}
.pp-weather{display:flex;align-items:center;gap:12px;height:40px}
.pp-weather[data-off=true] .pp-seg button[aria-pressed=true]{background:transparent;box-shadow:inset 0 0 0 1px var(--pp-edge-strong);color:var(--pp-subtle);font-weight:500}
.pp-toggles{display:flex;align-items:center;gap:24px;height:40px}
.pp-switch-row{display:flex;align-items:center;gap:10px;height:40px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--pp-ink);font-family:inherit;font-size:13px;line-height:18px;font-weight:500;cursor:pointer}
.pp-switch{position:relative;width:44px;height:26px;border-radius:999px;background:var(--pp-switch);box-shadow:inset 0 0 0 1px var(--pp-edge);transition:background .25s cubic-bezier(.22,.61,.36,1),box-shadow .25s cubic-bezier(.22,.61,.36,1)}
.pp-knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:var(--pp-thumb);box-shadow:0 2px 6px -1px rgba(0,0,0,.45);transition:transform .28s cubic-bezier(.22,.61,.36,1)}
.pp-switch-row[aria-checked=true] .pp-switch{background:linear-gradient(180deg,var(--pp-on),var(--pp-on-2));box-shadow:0 0 0 1px rgba(106,155,255,.4),0 4px 14px -8px rgba(47,107,238,.8)}
.pp-switch-row[aria-checked=true] .pp-knob{transform:translate(18px)}
.pp-track{--v:0;--over:0px;--pull:0;--origin:left;position:relative;width:160px;height:40px;cursor:pointer;touch-action:none;outline:none}
.pp-rail,.pp-fill{position:absolute;top:18px;height:3px;border-radius:999px}
.pp-body{position:absolute;inset:0;transform:scaleX(calc(1 + var(--pull)));transform-origin:var(--origin) center;transition:transform .42s cubic-bezier(.22,.61,.36,1)}
.pp-rail{left:0;right:0;background:var(--pp-rail)}
.pp-fill{left:0;width:calc(var(--v) * 100%);background:linear-gradient(90deg,var(--pp-fill-2),var(--pp-fill))}
.pp-stop{position:absolute;top:16px;width:1px;height:7px;margin-left:-.5px;border-radius:0;background:var(--pp-stop);opacity:.5;pointer-events:none}
.pp-thumb{position:absolute;top:10px;left:calc(var(--v) * 100%);width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--pp-thumb);box-shadow:0 3px 10px -2px rgba(0,0,0,.55),0 0 0 1px var(--pp-edge);transform:translate(var(--over));transition:transform .42s cubic-bezier(.22,.61,.36,1),box-shadow .18s ease}
.pp-track.pp-dragging .pp-body,.pp-track.pp-dragging .pp-thumb{transition:none}
.pp-track.pp-dragging .pp-thumb{box-shadow:0 4px 14px -2px rgba(0,0,0,.6),0 0 0 1px var(--pp-edge-strong)}
.pp-track:focus-visible .pp-thumb{box-shadow:0 0 0 3px var(--pp-focus),0 3px 10px -2px rgba(0,0,0,.5)}

@media(max-width:1100px){.pp-sep{display:none}}
/* 中窄窗口：台面排成三列两行（天气/方向、风速/阵风、显示/背景），
   别让「背景」被挤到第二行把台面撑高 */
@media(max-width:1240px){
  .pp-dock{display:grid;grid-template-rows:auto auto;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);align-items:end;justify-items:start;gap:14px 22px;width:100%}
  .pp-group{display:contents}
  .pp-sep{display:none}
}
@media(max-width:760px){
  .pp-frame{
    gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
            max(12px, env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  }
  .wt-sign img{height:22px}
  .pp-icon{width:40px;height:40px}

  /* 工作台：整宽浮层 + 两列。原来的 max-content 宽会把内容顶出屏幕 */
  .pp-dock-wrap{
    left:calc(12px + env(safe-area-inset-left));
    right:calc(12px + env(safe-area-inset-right));
    bottom:calc(12px + env(safe-area-inset-bottom));
    width:auto;max-width:none;
    transform:translateY(7px);
  }
  .pp-dock-wrap[data-open=true]{max-height:calc(100dvh - 84px);transform:none}
  .pp-dock{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    grid-template-rows:none;grid-auto-flow:row;grid-auto-columns:auto;
    align-items:start;justify-items:stretch;
    gap:14px 16px;width:100%;padding:14px;border-radius:20px;
  }
  .pp-group{display:contents}
  .pp-sep{display:none}
  .pp-field{min-width:0;gap:7px}
  .pp-field--full{grid-column:1 / -1}
  .pp-label{font-size:12px}
  .pp-value{font-size:13px}
  .pp-weather{justify-content:space-between;gap:10px;height:40px}
  .pp-switch-row{height:40px}
  .pp-seg{width:100%;height:38px}
  .pp-seg button{min-width:0;flex:1;padding:0 10px;font-size:12px}
  .pp-track{width:100%}
  .pp-toggles{justify-content:space-between;padding:0 2px}
}

/* 横屏手机：工作台横成一条，别把树盖住 */
@media(orientation:landscape) and (max-height:560px){
  .pp-dock-wrap[data-open=true]{max-height:44dvh}
  .pp-dock{
    display:flex;flex-wrap:nowrap;align-items:center;
    gap:14px;padding:10px 14px;border-radius:16px;
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  }
  .pp-group{display:flex;align-items:center;gap:14px}
  .pp-field{min-width:104px;flex:1 1 auto;gap:5px}
  .pp-field--full{min-width:184px}
  .pp-label{font-size:11px;line-height:14px}
  .pp-value{font-size:12px}
  .pp-weather{height:34px;gap:8px}
  .pp-switch-row{height:34px}
  .pp-switch{width:40px;height:24px}
  .pp-knob{width:18px;height:18px}
  .pp-switch-row[aria-checked=true] .pp-knob{transform:translate(16px)}
  .pp-seg{width:auto;height:32px;padding:2px}
  .pp-seg button{min-width:0;flex:1;padding:0 9px;font-size:12px}
  .pp-track{width:100%;min-width:90px;height:34px}
  .pp-track .pp-rail,.pp-track .pp-fill{top:15px}
  .pp-track .pp-thumb{top:7px}
}
@media(max-width:400px){.pp-weather{gap:6px}.pp-seg button{padding:0 8px}.wt-sub{display:none}}
@media(prefers-reduced-motion:reduce){
  .pp-about,.wt-grow{animation:none}
  .pp-frame,.pp-body,.pp-thumb,.pp-knob,.pp-icon,.pp-switch,.pp-knob,.wt-sign{transition:none}
  .pp-value.swap{animation:none}
}
@keyframes pp-bloom{0%{opacity:0;transform:translate(-50%) translateY(-6px) scale(.94)}to{opacity:1;transform:translate(-50%)}}
@keyframes pp-swap{0%{opacity:.2;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes pp-pop{0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.92)}to{opacity:1;transform:translateX(-50%)}}
/* 嵌进作品卡预览时只留树 */
.pp-frame[data-embed="true"] .pp-top,
.pp-frame[data-embed="true"] .pp-dock-wrap,
.pp-frame[data-embed="true"] .pp-dock,
.pp-frame[data-embed="true"] .wt-grow{display:none !important}
.pp-frame[data-embed="true"]{border-radius:0;grid-template-rows:minmax(0,1fr);padding:0;gap:0}
.pp-frame[data-embed="true"] .pp-stage{padding-top:0;height:100%}
</style>
</head>
<body>
<div class="pp-frame" id="frame" data-theme="light">
  <canvas class="pp-back" id="back" aria-hidden="true"></canvas>
  <canvas class="pp-back" id="backAnim" aria-hidden="true"></canvas>
  <div class="pp-grid" aria-hidden="true"></div>

  <header class="pp-top">
    <div class="pp-top-start">

<script>
/* ============================================================
   把风递给花瓣 · liyue
   一棵像素海棠，一副可算的骨架。全部在运行时生成，无外部素材。
   ============================================================ */
(function () {
  "use strict";

  var DPR = function () { return window.devicePixelRatio || 1; };
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function rnd(rng, a, b) { return a + rng() * (b - a); }
  function pick(rng, arr) { return arr[Math.floor(rng() * arr.length) % arr.length]; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ---------- 海棠配色：枝近黑褐，花白带粉，花心胭脂红，地上落粉 ---------- */
  /* 浅底一套：阴影压蓝灰，花近纯白，花苞是胭脂 */
  var PAL_LIGHT = {
    bark: ["#241511", "#452B1F", "#6A4632"],
    bloom: ["#AE7C89", "#CB9BA7", "#E6C6CE", "#F5E1E7", "#FDF4F7", "#FFFFFF", "#EFB4C4"],
    soil: ["#D9AEBC", "#E8C9D4", "#F4DFE7", "#B98A9B"],
    grass: ["#8FAC85", "#A9C49E", "#C6D9BB"]
  };
  /* 暗底一套：枝提亮，阴影落到深蓝，花更白，才浮得起来 */
  var PAL_DARK = {
    bark: ["#1B110D", "#3B261C", "#5C3D2B"],
    bloom: ["#7E5A63", "#9C7480", "#C29EA9", "#E6CBD4", "#FDF0F5", "#FFFFFF", "#E8A9BA"],
    soil: ["#3A2C31", "#46343A", "#544046", "#E7BECB"],
    grass: ["#2A3A4A", "#3D5370", "#546F90"]
  };
  var PAL = {
    bark: PAL_LIGHT.bark.slice(),
    bloom: PAL_LIGHT.bloom.slice(),
    soil: PAL_LIGHT.soil.slice(),
    grass: PAL_LIGHT.grass.slice()
  };
  var themeDark = false;
  function applyPalette(dark) {
    var src = dark ? PAL_DARK : PAL_LIGHT;
    PAL.bark = src.bark.slice();
    PAL.bloom = src.bloom.slice();
    PAL.soil = src.soil.slice();
    PAL.grass = src.grass.slice();
    themeDark = dark;
  }

  /* ---------- 像素团 ---------- */
  function makePuff(rng, r, colors, bias) {
    var size = r * 2 + 3;
    var cv = document.createElement("canvas");
    cv.width = size; cv.height = size;
    var c = cv.getContext("2d");
    var cx = r + 1, cy = r + 1;
    var s1 = rng() * 99, s2 = rng() * 99;
    var base = Math.round((colors.length - 1) * 0.52) + (bias || 0);
    base = Math.max(1, Math.min(colors.length - 2, base));
    for (var y = -r; y <= r; y++) {
      for (var x = -r; x <= r; x++) {
        var d = Math.sqrt(x * x + y * y);
        var ang = Math.atan2(y, x);
        var edge = r * (1 + 0.13 * Math.sin(ang * 3 + s1) + 0.09 * Math.sin(ang * 5.3 + s2));
        if (d > edge) continue;
        if (d > edge - 1.1 && rng() < 0.26) continue;
        var idx = base;
        var g = (x + y * 1.3) / r;
        if (g < -0.62) idx += 1;
        else if (g > 0.68) idx -= 1;
        if (rng() < 0.04) idx += rng() < 0.5 ? 1 : -1;
        if (rng() < 0.006) idx += 2;
        idx = Math.max(0, Math.min(colors.length - 1, Math.round(idx)));
        c.fillStyle = colors[idx];
        c.fillRect(cx + x, cy + y, 1, 1);
      }
    }
    for (var i = 0; i < 3; i++) {
      var a = rng() * 6.283, rr = r * 1.12;
      c.fillStyle = colors[Math.min(colors.length - 1, base + 1)];
      c.fillRect(cx + Math.round(Math.cos(a) * rr), cy + Math.round(Math.sin(a) * rr), 1, 1);
    }
    return { cv: cv, ox: cx, oy: cy };
  }

  /* ---------- 一团花：有棱有角的像素块，块上再点几朵小花 ---------- */
  /* 花：五瓣白、一颗胭脂心；花苞是更小的一点胭脂 */
  var BLOSSOM_ROWS = [".X.X.", "XWoWX", ".X.X."];
  var BUD_ROWS = [".X.", "XoX"];
  function makeFlowerBall(rng, r, bias) {
    var size = r * 2 + 5;
    var cv = document.createElement("canvas");
    cv.width = size; cv.height = size;
    var c = cv.getContext("2d");
    var cx = r + 2, cy = r + 2;
    /* 轮廓用折线切：圆周分成若干段、每段半径不同，边缘才有棱有角 */
    var segs = 4 + Math.floor(rng() * 3);
    var rr = [];
    for (var sg = 0; sg < segs; sg++) rr.push(r * (0.70 + rng() * 0.75));
    function edgeAt(ang) {
      var t = (ang / 6.2832 + 1) % 1 * segs;
      return rr[Math.floor(t) % segs];
    }
    var base = Math.max(1, Math.min(3, Math.round(2.7 + bias * 1.15 + (themeDark ? -0.7 : 0))));
    var base = Math.max(1, Math.min(3, Math.round(2.7 + bias * 1.15 + (themeDark ? -0.7 : 0))));
    /* 先铺一层基色块 */
    for (var y = -r; y <= r; y++) {
      for (var x = -r; x <= r; x++) {
        var d = Math.sqrt(x * x + y * y);
        var e = edgeAt(Math.atan2(y, x));
        if (d > e) continue;
        /* 只在贴边处咬几口，边缘毛糙；里面不掏洞 */
        if (d > e - 2.4 && rng() < 0.14) continue;
        c.fillStyle = PAL.bloom[base];
        c.fillRect(cx + x, cy + y, 1, 1);
      }
    }
    /* 再压几块暗斑：像一簇一簇的叶团，不是一个球 */
    var patches = 2 + Math.floor(rng() * 3);
    for (var pt = 0; pt < patches; pt++) {
      var pa = rng() * 6.283, pr = Math.sqrt(rng()) * (r - 2.2);
      var pxx = Math.round(Math.cos(pa) * pr);
      var pyy = Math.round(Math.sin(pa) * pr * 0.9) + 1;
      var prr = r * (0.34 + rng() * 0.3);
      for (var py2 = Math.round(pyy - prr); py2 <= pyy + prr; py2++) {
        for (var px2 = Math.round(pxx - prr); px2 <= pxx + prr; px2++) {
          var dd2 = (px2 - pxx) * (px2 - pxx) + (py2 - pyy) * (py2 - pyy);
          if (dd2 > prr * prr) continue;
          var bb = Math.sqrt(px2 * px2 + py2 * py2);
          if (bb > edgeAt(Math.atan2(py2, px2)) - 1) continue;
          var di = base - 1 - (rng() < 0.3 ? 1 : 0);
          c.fillStyle = PAL.bloom[Math.max(0, di)];
          c.fillRect(cx + px2, cy + py2, 1, 1);
        }
      }
    }
    /* 上沿提一条亮边，光从上面来 */
    for (var y2 = -r; y2 <= -1; y2++) {
      var wl = Math.round(Math.sqrt(Math.max(0, r * r * 0.92 - y2 * y2)));
      var off2 = Math.round(r * 0.2);
      for (var x2 = -wl + off2; x2 <= wl + off2; x2++) {
        var dx2 = x2 - off2;
        if (rng() < 0.5) continue;
        var b3 = Math.sqrt(dx2 * dx2 + y2 * y2);
        if (b3 > edgeAt(Math.atan2(y2, dx2)) - 1.2) continue;
        c.fillStyle = PAL.bloom[Math.min(PAL.bloom.length - 1, base + 1)];
        c.fillRect(cx + x2, cy + y2, 1, 1);
      }
    }
    /* 块上点花：靠外多一点 */
    var nb = Math.max(1, Math.round(r * 0.4));
    for (var i = 0; i < nb; i++) {
      var a2 = rng() * 6.283, rd = Math.sqrt(rng()) * (r - 1.2);
      var bx = Math.round(Math.cos(a2) * rd), by = Math.round(Math.sin(a2) * rd);
      var isBud = rng() < 0.08;
      var rows = isBud ? BUD_ROWS : BLOSSOM_ROWS;
      var petal = isBud ? "#C8687F" : (rng() < 0.28 ? "#FDF1F4" : "#FFFFFF");
      for (var ry = 0; ry < rows.length; ry++) {
        for (var rx = 0; rx < rows[ry].length; rx++) {
          var ch = rows[ry][rx];
          if (ch === ".") continue;
          c.fillStyle = ch === "X" ? petal : (ch === "W" ? "#F6D8E0" : "#D0889B");
          if (ch === "o" && rng() > 0.35) continue;
          c.fillRect(cx + bx + rx - 2, cy + by + ry - 1, 1, 1);
        }
      }
    }
    return { cv: cv, ox: cx, oy: cy };
  }

  /* ---------- 一朵海棠（五瓣白、胭脂心；有时是一颗花苞） ---------- */
  function makeBlossom(rng) {
    var cv = document.createElement("canvas");
    cv.width = 9; cv.height = 9;
    var c = cv.getContext("2d");
    var isBud = rng() < 0.34;
    var petal = rng() < 0.3 ? "#FCF2F5" : "#FFFFFF";
    var rows = isBud ? BUD_ROWS : BLOSSOM_ROWS;
    var dx = 2, dy = 2;
    /* 先压一圈淡粉的影，白花才从白花团里分得出来 */
    for (var y0 = 0; y0 < rows.length; y0++) {
      for (var x0 = 0; x0 < rows[y0].length; x0++) {
        if (rows[y0][x0] === ".") continue;
        c.fillStyle = isBud ? "#8E3346" : "#D9E0EC";
        c.fillRect(x0 + dx + 1, y0 + dy + 1, 1, 1);
      }
    }
    for (var y = 0; y < rows.length; y++) {
      for (var x = 0; x < rows[y].length; x++) {
        var ch = rows[y][x];
        if (ch === ".") continue;
        c.fillStyle = ch === "X" ? (isBud ? "#CF5771" : petal)
          : (ch === "W" ? "#F6D8E0" : "#C7526B");
        c.fillRect(x + dx, y + dy, 1, 1);
      }
    }
    return { cv: cv, ox: dx + 2, oy: dy + 1 };
  }

  /* ---------- 落下的花瓣 ---------- */
  function makeFaller(rng, kind) {
    var cv = document.createElement("canvas");
    var c, s;
    /* 浅底上白花瓣会看不见，换一点藕粉 */
    var pale = themeDark ? "#FFFFFF" : "#FBEFF3";
    var soft = themeDark ? "#FCF0F3" : "#E9C3CF";
    if (kind === "flower") {
      cv.width = 5; cv.height = 5; c = cv.getContext("2d");
      var rows = [".X.", "XoX", ".X."];
      for (var y = 0; y < 3; y++) for (var x = 0; x < 3; x++) {
        if (rows[y][x] === ".") continue;
        c.fillStyle = rows[y][x] === "o" ? "#C7526B" : pale;
        c.fillRect(x + 1, y + 1, 1, 1);
      }
      return { cv: cv, ox: 2, oy: 2 };
    }
    cv.width = 4; cv.height = 4; c = cv.getContext("2d");
    s = rng() < 0.45 ? soft : pale;
    c.fillStyle = s;
    if (rng() < 0.55) { c.fillRect(0, 1, 2, 1); c.fillRect(1, 0, 1, 2); }
    else { c.fillRect(1, 0, 1, 3); }
    c.fillStyle = soft;
    c.fillRect(1, 2, 1, 1);
    return { cv: cv, ox: 1, oy: 1 };
  }

  /* ---------- 一片叶子（灌木上掉下来的那些） ---------- */
  function makeLeafSprite(rng, light) {
    var cv = document.createElement("canvas");
    cv.width = 4; cv.height = 4;
    var c = cv.getContext("2d");
    var gs = PAL.grass;
    var a = gs[light ? 2 : 1], b = gs[light ? 1 : 0];
    c.fillStyle = a;
    c.fillRect(1, 0, 2, 1); c.fillRect(0, 1, 3, 1); c.fillRect(1, 2, 1, 1);
    c.fillStyle = b;
    c.fillRect(1, 1, 1, 1); c.fillRect(2, 2, 1, 1);
    return { cv: cv, ox: 1, oy: 1 };
  }

  /* ============================================================
     背景：一段沿海公路。扁平像素，海平线压得低，路收在远处一点。
     尺寸全按比例算，铺满整个舞台，和树共用一样大的像素格。
     ============================================================ */
  var BACK_NIGHT = {
    sky: ["#080E1A", "#0B1321", "#10192A", "#141F33", "#19263D", "#1E2D48", "#243553", "#2A3E5E"],
    glow: "#4E6E92",
    stars: true, star: "#DCE8F6", star2: "#7E96B6",
    moon: true, moonCol: "#ECF4FD", moonDim: "#B2C5DA",
    sea: ["#152437", "#182A3F", "#1C3047", "#21384F", "#263E57"],
    seaGlare: "#2C4A69",
    wave: "#2C4764", wave2: "#426382",
    reflect: "rgba(214,232,248,.20)",
    foam: "#A6BFD6",
    wall: "#232C3D", wallTop: "#46536B",
    sand: "#343C50", sandDark: "#272E3E",
    land: "#1D2433", land2: "#27324A", land3: "#141B28",
    headland: "#22314A", tower: "#8FA1B6", towerDark: "#4A5B73", lamp: "#FFD18E",
    road: "#333A4C", roadEdge: "#495771", line: "#9DB2C9",
    curb: "#4B566C", curbTop: "#6E7B92", lampPost: "#4E5B72", rail: "#55647A", railDark: "#2B3546",
    lawn: "#212A39", lawn2: "#25313F", blade: "#2E4056", lawnEdge: "#2A3849",
    bush: "#22302C", bushMid: "#2A3F3C", bushLit: "#3A5551", bushDark: "#1B2724",
    bloomW: "#E8F0FA", bloomP: "#EFC6D4", stem: "#2B3A48",
    solid: "#1a2130", solidLit: "#202b40", solidDeep: "#141a28", solidShadow: "#101620"
  };

  var BACK_DAY = {
    sky: ["#DDEBF9", "#D6E6F6", "#CEE0F3", "#C6DAF0", "#BED4ED", "#B6CDEA", "#AEC6E6", "#A6BFE2"],
    glow: "#F4F8FD",
    stars: false, moon: false, moonCol: "#FFFFFF", moonDim: "#DBE7F3",
    sea: ["#93B7D1", "#87ACC9", "#7BA2C1", "#6F98B9", "#6390B1"],
    wave: "#CFE3F0", wave2: "#B4D1E4",
    reflect: "rgba(255,255,255,.28)",
    foam: "#FFFFFF",
    sand: "#EAE6DB", sandDark: "#DCD7C9",
    land: "#CFDCC9", land2: "#B7C9B0", land3: "#A6BCA0",
    headland: "#8CA5B6", tower: "#FFFFFF", towerDark: "#C2CED9", lamp: "#FFC97A",
    road: "#C5CBD6", roadEdge: "#9FA8B8", line: "#FFFFFF",
    curb: "#B3BCC8", curbTop: "#DDE4EC", lampPost: "#8F9CAB", rail: "#9AA6B6", railDark: "#7E8B9D",
    lawn: "#D8E6CE", lawn2: "#DEEBD4", blade: "#BCD1B1", lawnEdge: "#C9DBBE",
    bush: "#9DBA92", bushMid: "#8AA97F", bushLit: "#B6D0AB", bushDark: "#78936F",
    bloomW: "#FFFFFF", bloomP: "#F0C3D1", stem: "#87A07E",
    solid: "#F5F5FF", solidLit: "#FCFBFF", solidDeep: "#E9E9F8", solidShadow: "#C6C6DF"
  };

  /* 树下草坪上一小丛灌木、一小片野花；位置是相对树根的偏移（和树同一套像素格） */
  var BUSHES = [
    { dx: -120, dy: 14, w: 46, h: 19 },
    { dx: -66, dy: 24, w: 30, h: 12 },
    { dx: 96, dy: 17, w: 40, h: 16 },
    { dx: 146, dy: 26, w: 24, h: 10 }
  ];

  /* 纯色模式：一层渐变灰的天光 + 树后一团光 + 落地影。就这几样，画面不再多话。 */
  /* 纯色模式：一整片 #f5f5ff，没有渐变、没有光晕，树自己站在画面里 */
  function drawSolidFloor(ctx, bw, bh, pal) {
    ctx.fillStyle = pal.solid;
    ctx.fillRect(0, 0, bw, bh);
  }

  /* 两个十六进制色按 k 调匀，用来把色带之间的硬边过渡掉 */
  function hexRGB(h) {
    h = String(h).replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mixHex(a, b, k) {
    var A = hexRGB(a), B = hexRGB(b);
    return "rgb(" + Math.round(A[0] + (B[0] - A[0]) * k) + "," +
      Math.round(A[1] + (B[1] - A[1]) * k) + "," +
      Math.round(A[2] + (B[2] - A[2]) * k) + ")";
  }

  function drawBackdrop(ctx, bw, bh, pal, ax, ay) {
    var rng = mulberry32(4242);
    function px(x, y, w, h, c) {
      ctx.fillStyle = c;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    }
    ctx.imageSmoothingEnabled = false;

    /* 地平线不按画幅高度分，而是钉在树脚上：手机竖屏画幅又高又窄，
       按比例分带会让公路横在树腰、灌木长到路面上去。 */
    if (!(ax > 0)) ax = Math.round(bw * 0.5);
    if (!(ay > 0)) ay = Math.round(bh * 0.72);
    ax = Math.max(6, Math.min(bw - 6, Math.round(ax)));

    var GY = Math.round(ay);                                        /* 树脚 */
    var FOOT = Math.max(8, Math.round(GY * 0.085));                 /* 树脚落在路沿下多少 */
    var RBOT = Math.round(GY - FOOT);                               /* 路面下沿 */
    var ROAD_H = Math.min(Math.max(22, Math.round(bh * 0.086)), Math.max(18, Math.round(GY * 0.13)));
    var RTOP = Math.round(RBOT - ROAD_H);                           /* 路面上沿 */
    var SAND_H = Math.min(Math.max(7, Math.round(bh * 0.026)), Math.round(ROAD_H * 0.55));
    var SHORE = Math.round(RTOP - SAND_H);                          /* 水线 */
    var SEA_H = Math.max(40, Math.round(SHORE * 0.55));
    var HOR = Math.max(Math.round(bh * 0.12), Math.round(SHORE - SEA_H));  /* 海平线 */
    var CUB = Math.max(2, Math.round(bh * 0.005));                  /* 路缘厚度 */

    /* ---------- 天：八道横带 ---------- */
    /* 两条色带之间用两三行中间色铺过去，不要一条一条刀切似的横线 */
    function seam(y, upC, dnC) {
      px(0, y - 1, bw, 1, mixHex(upC, dnC, 0.3));
      px(0, y, bw, 1, mixHex(upC, dnC, 0.62));
      px(0, y + 1, bw, 1, mixHex(upC, dnC, 0.84));
    }
    var bands = pal.sky.length, bhh = HOR / bands;
    for (var b = 0; b < bands; b++) {
      var by0 = Math.round(b * bhh), by1 = Math.round((b + 1) * bhh);
      px(0, by0, bw, by1 - by0 + 1, pal.sky[b]);
    }
    for (var sb2 = 1; sb2 < bands; sb2++) seam(Math.round(sb2 * bhh), pal.sky[sb2 - 1], pal.sky[sb2]);
    px(0, HOR - 1, bw, 1, pal.glow);

    /* 星、月、浪都挪到了 anim 那一层（逐帧动），这里只留不动的天与海 */

    /* ---------- 海 ---------- */
    var seaH = SHORE - HOR, segs = pal.sea.length;
    for (var i = 0; i < segs; i++) {
      var y0 = HOR + Math.round(seaH * i / segs);
      var y1 = HOR + Math.round(seaH * (i + 1) / segs);
      px(0, y0, bw, y1 - y0 + 1, pal.sea[i]);
    }
    for (var si2 = 1; si2 < segs; si2++) seam(HOR + Math.round(seaH * si2 / segs), pal.sea[si2 - 1], pal.sea[si2]);
    /* 海平线不当成一条通长的亮线：一格一格错开，远看才是水天相接 */
    for (var hz = 0; hz < bw; hz += 5) {
      px(hz + (rng() < 0.4 ? 1 : 0), HOR, 3 - Math.floor(rng() * 2), 1, pal.seaGlare);
    }

    /* 近岸的浅水：贴着岸的几行海水里掺沙色，水跟沙之间不是一刀切的边 */
    for (var sr = 0; sr < 6; sr++) {
      var yq = SHORE - 6 + sr;
      if (yq <= HOR + 1) continue;
      var mix = (sr + 1) / 7;
      for (var xq = 0; xq < bw; xq += 3) {
        if (rng() < mix * 0.9) px(xq + (rng() < 0.5 ? 1 : 0), yq, 1 + Math.floor(rng() * 2), 1, pal.sand);
      }
    }

    /* 远处的海岬，角上立一座小灯塔 */
    var hw = Math.round(bw * 0.115);
    for (var hx = 0; hx < hw; hx++) {
      var hh = Math.round(bh * 0.032 * Math.pow(1 - hx / hw, 1.4));
      if (hh > 0) px(hx, HOR - hh, 1, hh + 1, pal.headland);
    }
    var tw = Math.max(2, Math.round(bw * 0.004)), th = Math.max(4, Math.round(bh * 0.012));
    /* 塔不放在画幅最外沿，站到海岬上、留得下整座塔 */
    var lx = Math.min(Math.round(hw * 0.34), Math.max(2, bw - 8));
    px(lx, HOR - th - 2, tw + 1, th, pal.tower);
    px(lx, HOR - th + Math.round(th * 0.35), tw + 1, Math.max(1, Math.round(th * 0.14)), pal.towerDark);
    px(lx + Math.round(tw / 2), HOR - th - 3, 1, 1, pal.lamp);
    px(lx + Math.round(tw / 2) + 1, HOR - th - 3, 3, 1, "rgba(255,208,140,.32)");
    px(lx + Math.round(tw / 2) - 2, HOR - th - 3, 1, 1, "rgba(255,208,140,.18)");

    /* ---------- 沙滩 ---------- */
    px(0, SHORE, bw, RTOP - SHORE, pal.sand);
    /* 岸线不是一条白线：一段一段的浪头，长短粗细都不齐，还有退回去的泡沫 */
    for (var seg2 = -4; seg2 < bw; seg2 += 6 + Math.floor(rng() * 7)) {
      var sLen = 3 + Math.floor(rng() * 6);
      px(seg2, SHORE, sLen, 1, pal.foam);
      if (rng() < 0.45) px(seg2 + 1, SHORE - 1, Math.max(2, sLen - 2), 1, pal.foam);
      if (rng() < 0.3) {
        for (var df = 0; df < 3; df++) {
          if (rng() < 0.5) px(seg2 + Math.floor(rng() * sLen), SHORE - 2 - df, 1, 1, pal.foam);
        }
      }
    }
    for (var f = 0; f < Math.round(bw * 0.06); f++) {
      var fx = Math.floor(rng() * bw), fl = Math.max(2, Math.round(1 + rng() * bw * 0.012));
      px(fx, SHORE - 1 + (rng() < 0.45 ? 0 : 1), fl, 1, pal.foam);
    }
    for (var pbl = 0; pbl < Math.round(bw * 0.02); pbl++) {
      px(Math.floor(rng() * bw), SHORE + 3 + Math.floor(rng() * Math.max(2, RTOP - SHORE - 5)),
        rng() < 0.4 ? 2 : 1, 1, rng() < 0.6 ? pal.sandDark : pal.wallTop);
    }
    px(0, RTOP - 1, bw, 1, pal.sandDark);

    /* ---------- 公路：横着一条，从这头贯到那头 ---------- */
    px(0, RTOP, bw, RBOT - RTOP, pal.road);
    px(0, RTOP, bw, 1, pal.roadEdge);
    px(0, RBOT - 1, bw, 1, pal.roadEdge);
    /* 中线虚线 */
    var midY = Math.round((RTOP + RBOT) / 2);
    var dl = Math.max(4, Math.round(bw * 0.018)), dg = Math.max(4, Math.round(bw * 0.016));
    var dt = Math.max(1, Math.round(bh * 0.003));
    for (var dx2 = -dl; dx2 < bw; dx2 += dl + dg) px(dx2, midY, dl, dt, pal.line);
    /* 海侧的护栏：一道横杆，一排栏杆 */
    var railY = RTOP - Math.max(3, Math.round(bh * 0.005));
    for (var pg = 0; pg < bw; pg += Math.max(9, Math.round(bw * 0.024))) {
      px(pg, railY, 1, RTOP - railY + 1, pal.rail);
      px(pg, railY, 1, 1, pal.railDark);
    }
    px(0, railY, bw, 1, pal.rail);
    /* 路灯：一排，间距一样，灯头一点暖光 */
    var lg = Math.max(30, Math.round(bw * 0.165)), lh = Math.max(10, Math.round(bh * 0.036));
    for (var lxo = Math.round(bw * 0.05); lxo < bw; lxo += lg) {
      var ltop = RTOP - lh;
      px(lxo, ltop, 2, lh, pal.lampPost);
      px(lxo - 1, ltop, 4, 2, pal.lampPost);
      px(lxo, ltop - 1, 2, 2, pal.lamp);
      px(lxo - 2, ltop - 1, 6, 3, "rgba(255,208,140,.11)");
      px(lxo - 3, ltop - 4, 8, 1, "rgba(255,208,140,.06)");
      px(lxo - 7, RTOP + 2, 15, 1, "rgba(255,208,140,.05)");
    }

    /* ---------- 前景草地：近处这一片都当草坪，一道一道横着修过去 ---------- */
    px(0, RBOT, bw, bh - RBOT, pal.land);
    var foot = Math.max(4, Math.round(bh * 0.03));
    var gTop = RBOT + CUB + 2;
    var bandH = Math.max(3, Math.round(bh * 0.0125));
    for (var my = gTop; my < bh - foot; my += bandH) {
      if (Math.floor((my - gTop) / bandH) % 2 === 0) px(0, my, bw, Math.min(bandH, bh - foot - my), pal.lawn);
    }
    for (var g = 0; g < Math.round(bw * 0.55); g++) {
      var gx = Math.floor(rng() * bw);
      var gy = gTop + 2 + Math.floor(rng() * Math.max(1, bh - gTop - 12));
      px(gx, gy, rng() < 0.3 ? 2 : 1, 1, rng() < 0.7 ? pal.blade : pal.land2);
    }
    px(0, bh - foot, bw, foot, pal.land3);
    /* 路缘压在草地这头 */
    px(0, RBOT, bw, 1, pal.curbTop);
    px(0, RBOT + 1, bw, CUB, pal.curb);

    /* ---------- 树底下的草坪：树根周围多长几簇短草 ---------- */
    var lawnTop = Math.round(ay) - 4;
    var bedRx = Math.min(Math.round(bh * 0.24), Math.round(bw * 0.42)), bedRy = Math.round(bh * 0.078);
    var bedCy = Math.round(ay) + Math.round(bh * 0.016);
    var tuftN = Math.round(bedRx * 0.95);
    for (var tf = 0; tf < tuftN; tf++) {
      var tcx = Math.round(ax + (rng() * 2 - 1) * bedRx * (0.25 + rng() * 0.75));
      var tcy = Math.round(bedCy + (rng() * 2 - 1) * bedRy * (0.25 + rng() * 0.8));
      if (tcx < 2 || tcx >= bw - 3 || tcy < gTop + 1 || tcy >= bh - foot) continue;
      var tall = 2 + Math.round(rng() * 2);
      px(tcx, tcy - tall, 1, tall, pal.blade);
      px(tcx + 1, tcy - tall + 1, 1, tall, pal.lawnEdge);
      px(tcx - 1, tcy - tall + 2, 1, tall, pal.blade);
    }
    /* 草坪上的草尖，再撒一层 */
    var hwB = Math.round(bedRx * 0.94);
    for (var bl = 0; bl < Math.round(hwB * 1.6); bl++) {
      var bx2 = Math.round(ax + (rng() * 2 - 1) * hwB);
      var by3 = Math.round(bedCy - bedRy * 0.55 + rng() * Math.max(2, bh - bedCy - foot));
      if (bx2 < 0 || bx2 >= bw || by3 >= bh - foot) continue;
      px(bx2, by3 - 1, 1, 1, rng() < 0.6 ? pal.blade : pal.lawnEdge);
    }
    /* 几朵小野花，白一朵粉一朵 */
    for (var fl = 0; fl < 16; fl++) {
      var fxp = Math.round(ax + (rng() * 2 - 1) * bedRx * 1.1);
      var fyp = Math.round(bedCy - bedRy * 0.35 + rng() * Math.max(4, bh - bedCy - foot - 10));
      if (fxp < 4 || fxp >= bw - 4 || fyp >= bh - foot - 2) continue;
      var pink = rng() < 0.5;
      var fc = pink ? pal.bloomP : pal.bloomW;
      px(fxp, fyp - 3, 1, 3, pal.stem);                    /* 茎 */
      px(fxp - 1, fyp - 4, 1, 1, pal.lawnEdge);            /* 一片叶子 */
      px(fxp, fyp - 7, 1, 1, fc);                           /* 花瓣 */
      px(fxp - 1, fyp - 6, 3, 1, fc);
      px(fxp - 2, fyp - 5, 5, 1, fc);
      px(fxp - 1, fyp - 4, 3, 1, fc);
      px(fxp, fyp - 5, 1, 1, pink ? pal.bloomW : "#F0D7A8");/* 花心 */
    }
    /* 灌木：几个球叠成一丛，边上是碎的 */
    /* 灌木：几个球叠成一丛，边上是碎的。窄画幅上把丛往树根收一收，免得全被裁到画外 */
    var bushK = Math.min(1, Math.max(0.5, bw / 420));
    for (var bu = 0; bu < BUSHES.length; bu++) {
      var BS = BUSHES[bu];
      var bxc = Math.round(ax + BS.dx * bushK);
      var byc = Math.round(lawnTop + BS.dy);
      if (bxc < 6 || bxc > bw - 6 || byc >= bh - foot) continue;
      var bhw = Math.round(BS.w / 2), bhh2 = BS.h;
      /* 底下那点影 */
      px(bxc - bhw, byc + 1, bhw * 2, 1, "rgba(8,12,20,.32)");
      px(bxc - Math.round(bhw * 0.7), byc + 2, Math.round(bhw * 1.4), 1, "rgba(8,12,20,.18)");
      var circles = [
        { cx: bxc, r: Math.round(bhh2 * 0.62) },
        { cx: bxc - Math.round(bhw * 0.52), r: Math.round(bhh2 * 0.46) },
        { cx: bxc + Math.round(bhw * 0.5), r: Math.round(bhh2 * 0.43) },
        { cx: bxc + Math.round(bhw * 0.06), r: Math.round(bhh2 * 0.5) }
      ];
      for (var ci = 0; ci < circles.length; ci++) {
        var CC = circles[ci];
        var ccy = byc - CC.r + 1;
        for (var yy = -CC.r; yy <= CC.r; yy++) {
          for (var xx = -CC.r; xx <= CC.r; xx++) {
            var dd2 = xx * xx + yy * yy;
            if (dd2 > CC.r * CC.r) continue;
            if (dd2 > (CC.r - 1.3) * (CC.r - 1.3) && rng() < 0.12) continue;   /* 碎边 */
            var qq = (xx + yy * 1.25) / CC.r;
            var colB = qq < -0.42 ? pal.bushLit : (qq > 0.62 ? pal.bushDark : pal.bushMid);
            if (rng() < 0.02) colB = qq < 0 ? pal.bushLit : pal.bushDark;
            px(CC.cx + xx, ccy + yy, 1, 1, colB);
          }
        }
      }
      /* 沿地那一条暗，压住根 */
      px(bxc - bhw + 1, byc, bhw * 2 - 2, 1, pal.bushDark);
    }

    return { bw: bw, bh: bh, HOR: HOR, SHORE: SHORE };
  }

  /* ============================================================
     会动的一层：海、星、月
     静态底图上只有天带、海水底色、沙滩、公路、草坪；浪痕、星星、月亮
     全在这一层逐帧画。浪是一道道独立的痕，按小数坐标逐帧推，位移连续；
     星星各自有相位慢慢漂、慢慢亮；月亮连着海上那道碎光一起极慢地挪。
     ============================================================ */
  var anim = { on: false, bw: 0, bh: 0, HOR: 0, SHORE: 0, marks: [], stars: [], shimmer: [], moon: null, pal: null };

  /* 十六进制色 + 透明度的 rgba，浪花半透明地贴在水面上才不刺眼 */
  function withAlpha(hex, a) {
    var h = String(hex).replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }

  /* 月：光晕和月盘各存一张小精灵，逐帧只做位移和一点点透明度起伏 */
  function buildMoon(bh, pal) {
    var mr = Math.max(3, Math.round(bh * 0.017));
    var R = mr + 10;
    var halo = document.createElement("canvas");
    halo.width = halo.height = R * 2 + 1;
    var hg = halo.getContext("2d");
    hg.imageSmoothingEnabled = false;
    for (var ring = 3; ring >= 1; ring--) {
      var rr = mr + ring * 3;
      for (var hy = -rr; hy <= rr; hy++) {
        var hx = Math.floor(Math.sqrt(rr * rr - hy * hy));
        if (hx < mr + 1) continue;
        var a = ring === 3 ? 0.03 : (ring === 2 ? 0.05 : 0.075);
        hg.fillStyle = "rgba(150,190,240," + a + ")";
        hg.fillRect(R - hx, R + hy, hx * 2 + 1, 1);
      }
    }
    var dw = mr * 2 + 3;
    var disc = document.createElement("canvas");
    disc.width = disc.height = dw;
    var dg = disc.getContext("2d");
    dg.imageSmoothingEnabled = false;
    var c = mr + 1;
    for (var dy = -mr; dy <= mr; dy++) {
      var dxx = Math.floor(Math.sqrt(mr * mr - dy * dy));
      dg.fillStyle = pal.moonCol;
      dg.fillRect(c - dxx, c + dy, dxx * 2 + 1, 1);
    }
    dg.fillStyle = pal.moonDim;
    dg.fillRect(c + 1, c - Math.round(mr * 0.4), Math.max(1, mr), Math.max(1, Math.round(mr * 0.6)));
    return { halo: halo, disc: disc, R: R, ox: 0, oy: 0 };
  }

  function buildAnim(geo, pal) {
    var bw = geo.bw, bh = geo.bh, HOR = geo.HOR, SHORE = geo.SHORE;
    anim.on = true; anim.bw = bw; anim.bh = bh; anim.HOR = HOR; anim.SHORE = SHORE; anim.pal = pal;
    if (animCv.width !== bw || animCv.height !== bh) { animCv.width = bw; animCv.height = bh; }

    /* 浪不再是整块贴片平移——那样每挪一格就跳 2 个屏幕像素，看着像卡帧。
       改成一道道独立的浪痕，逐帧按小数坐标画，画布自己补那半格，
       位移是连续的，跟花瓣落地一个手感。三层速度不同，水是层层推过来的。 */
    var seaH = SHORE - HOR;
    var bands = [
      { y0: HOR + 2, y1: SHORE - 1, sp: 0.30, d0: 0.016, d1: 0.020, l0: 1, l1: 5, seed: 9001 },
      { y0: Math.round(HOR + seaH * 0.30), y1: SHORE - 1, sp: 0.62, d0: 0.012, d1: 0.018, l0: 1, l1: 8, seed: 9002 },
      { y0: Math.round(HOR + seaH * 0.66), y1: SHORE - 1, sp: 1.05, d0: 0.010, d1: 0.016, l0: 2, l1: 12, seed: 9003 }
    ];
    anim.marks = [];
    for (var bi = 0; bi < bands.length; bi++) {
      var B = bands[bi], rb = mulberry32(B.seed);
      var yy = B.y0, span = Math.max(1, B.y1 - B.y0);
      while (yy < B.y1 - 1) {
        var kk = (yy - B.y0) / span;
        var den = B.d0 + (B.d1 - B.d0) * kk;
        var cnt = Math.max(1, Math.round(bw * den));
        for (var j = 0; j < cnt; j++) {
          var p1 = rb(), p2 = rb(), p3 = rb(), p4 = rb();
          var ca = p4 < 0.2 ? 0.34 : (p4 < 0.58 ? 0.85 : 0.55);
          anim.marks.push({
            x0: p1 * bw,
            y: yy,
            len: B.l0 + Math.floor(p2 * (B.l1 - B.l0 + 1)),
            sp: B.sp,
            /* 颜色串在这里就拼好，逐帧只填，不每帧再解析十六进制 */
            fill: withAlpha(p3 < 0.58 ? pal.wave : pal.wave2, ca)
          });
        }
        yy += 2 + (rb() < 0.34 ? 1 : 0);
      }
    }

    /* 水面上的零星光点：不跟着浪走，各自亮各自的，水才活 */
    anim.shimmer = [];
    var rs = mulberry32(31313);
    var nSh = Math.round(bw * 0.05);
    for (var q = 0; q < nSh; q++) {
      anim.shimmer.push({
        x: Math.floor(rs() * bw),
        y: Math.round(HOR + 4 + rs() * Math.max(4, seaH - 8)),
        ph: rs() * 6.283,
        sp: 0.5 + rs() * 1.1,
        len: 1 + Math.floor(rs() * 2),
        dx: 0.18 + rs() * 0.55
      });
    }

    anim.stars = [];
    if (pal.stars) {
      var rng = mulberry32(70707);
      var nStar = Math.round(bw * 0.15);
      for (var s = 0; s < nStar; s++) {
        var sy = Math.round(2 + rng() * (HOR - 6));
        if (sy > HOR * 0.7 && rng() < 0.75) continue;
        anim.stars.push({
          x: Math.floor(rng() * bw), y: sy,
          w: rng() < 0.18 ? 2 : 1,
          ph: rng() * 6.283,
          sp: 0.45 + rng() * 0.95,          /* 各自闪的节奏 */
          dx: 0.16 + rng() * 0.5,           /* 慢慢往右挪，一分钟才几个像素 */
          pale: rng() < 0.45
        });
      }
    }

    anim.moon = pal.moon ? buildMoon(bh, pal) : null;
    if (anim.moon) {
      anim.moon.ox = Math.round(bw * 0.73);
      anim.moon.oy = Math.round(bh * 0.10);
    }
  }

  function paintAnim(t) {
    if (!anim.on) return;
    var bw = anim.bw, bh = anim.bh, pal = anim.pal, ctx = animCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, bw, bh);

    /* ---------- 星：各自漂、各自闪；坐标不取整，让画布自己补那半个像素 ---------- */
    for (var i = 0; i < anim.stars.length; i++) {
      var s = anim.stars[i];
      var x = (s.x + t * s.dx) % bw;
      if (x < 0) x += bw;
      var tw = Math.sin(t * s.sp * 2.2 + s.ph);
      if (tw < -0.5) continue;                       /* 暗下去时歇一口气，不是全都常亮 */
      var a = Math.min(1, 0.26 + (tw + 0.5) * 0.55); /* 亮度连着走，不三档跳 */
      ctx.fillStyle = withAlpha(s.pale ? pal.star2 : pal.star, a);
      ctx.fillRect(x, s.y, s.w, 1);
      if (tw > 0.88) ctx.fillRect(x, s.y - 1, 1, 1); /* 最亮时闪一颗星芒 */
    }

    /* ---------- 月：极慢地挪，光晕慢慢呼吸；海上那道碎光跟着走 ---------- */
    if (anim.moon) {
      var m = anim.moon;
      var mx = m.ox + Math.sin(t * 0.0016) * bw * 0.05;
      var my = m.oy + Math.sin(t * 0.0011 + 1.1) * bh * 0.014;
      ctx.globalAlpha = 0.8 + 0.2 * Math.sin(t * 0.0011 + 0.6);
      ctx.imageSmoothingEnabled = true;              /* 月亮是圆的，让它按小数位走 */
      ctx.drawImage(m.halo, mx - m.R, my - m.R);
      ctx.globalAlpha = 1;
      ctx.drawImage(m.disc, mx - m.disc.width / 2, my - m.disc.height / 2);
      ctx.imageSmoothingEnabled = false;

      var step = Math.max(3, Math.round(bh * 0.011));
      for (var ry = anim.HOR + step; ry < anim.SHORE - 2; ry += step) {
        var t2 = (ry - anim.HOR) / Math.max(1, anim.SHORE - anim.HOR);
        var half = 1 + t2 * 6;
        var sway = Math.sin(t * 0.9 + ry * 0.22) * (2 + t2 * 5);
        if (Math.sin(t * 0.7 + ry * 0.31) < -0.75) continue;   /* 有的行这会儿先暗掉 */
        ctx.fillStyle = pal.reflect;
        ctx.fillRect(mx - half + sway, ry, half * 2, 1);
      }
    }

    /* ---------- 浪：一道道痕按小数坐标推，每帧都在动，不跳格 ---------- */
    for (var w = 0; w < anim.marks.length; w++) {
      var mk = anim.marks[w];
      var wx = (mk.x0 + t * mk.sp) % bw;
      if (wx < 0) wx += bw;
      ctx.fillStyle = mk.fill;
      ctx.fillRect(wx, mk.y, mk.len, 1);
      if (wx + mk.len > bw) ctx.fillRect(wx - bw, mk.y, mk.len, 1);   /* 绕回左边 */
    }

    /* ---------- 水光：不跟浪走的零星点点，自己亮自己暗 ---------- */
    for (var q = 0; q < anim.shimmer.length; q++) {
      var sh = anim.shimmer[q];
      var lit = Math.sin(t * sh.sp + sh.ph);
      if (lit < 0.15) continue;
      var sx3 = (sh.x + t * sh.dx) % bw;
      if (sx3 < 0) sx3 += bw;
      ctx.fillStyle = withAlpha(pal.wave, 0.1 + lit * 0.3);
      ctx.fillRect(sx3, sh.y, sh.len, 1);
    }
  }



  /* ============================================================
     一棵海棠
     ============================================================ */
  var SPEC = { name: "海棠", w: 320, h: 300, baseX: 158, baseY: 278, seed: 20261 };
  /* 画布给树留出余量：大风、拖拽时树冠会荡出这个 320×300，不留白就被硬边切掉 */
  var PAD_X = 56, PAD_Y = 12;
  var SC_W = SPEC.w + PAD_X * 2, SC_H = SPEC.h + PAD_Y;

  function buildPlant(spec) {
    var rng = mulberry32(spec.seed);
    var joints = [];
    var clusters = [];
    var ground = document.createElement("canvas");
    ground.width = spec.w; ground.height = spec.h;

    function addJoint(parent, dx, dy, w, bend) {
      var p = parent >= 0 ? joints[parent] : null;
      var j = {
        parent: parent, dx: dx, dy: dy, w: w, bend: bend,
        phase: rng() * Math.PI * 2,
        depth: p ? p.depth + 1 : 0,
        level: p ? p.level + 1 : 0,
        rx: p ? p.rx + dx : spec.baseX,
        ry: p ? p.ry + dy : spec.baseY,
        wx: p ? p.rx + dx : spec.baseX,
        wy: p ? p.ry + dy : spec.baseY,
        rot: 0
      };
      joints.push(j);
      return joints.length - 1;
    }
    function grow(start, angle, len, segs, w0, curve, bend) {
      var cur = start, a = angle, step = len / segs;
      for (var i = 0; i < segs; i++) {
        a += curve;
        cur = addJoint(cur, Math.sin(a) * step, -Math.cos(a) * step,
          Math.max(2, Math.round(w0 * (1 - (i / segs) * 0.55))), bend);
      }
      return cur;
    }

    /* 海棠的形：干矮而粗、几下里就分成大枝，枝横着铺开，冠比干宽得多 */
    var cfg = {
      height: 98, segs: 8, wBase: 15, lean: 0.016, wob: 0.1,
      branches: 5, branchLen: 70
    };

    /* 主干：粗、短、几乎直，只在基部略收 */
    var cur = -1, yStep = cfg.height / cfg.segs;
    for (var i = 0; i < cfg.segs; i++) {
      var t = i / Math.max(1, cfg.segs - 1);
      var w = Math.max(4, Math.round(cfg.wBase * (1 - t * 0.52)));
      var dx = cfg.lean * yStep + Math.sin(t * 3.4 + 0.7) * cfg.wob + rnd(rng, -0.3, 0.3);
      cur = addJoint(cur, dx, -yStep, w, 0.005 + 0.003 * t);
    }
    var trunkTop = cur;

    /* 主干关节的 level 归零，好和枝条分开 */
    for (var tk = 0; tk <= trunkTop; tk++) {
      joints[tk].level = 0; joints[tk].depth = 0;
    }

    /* 主枝：低处分大枝、几乎横着走，越往上越收 —— 像把伞骨撑开 */
    var branchSpec = [
      [0.44, 1.14, 54], [0.56, 0.98, 52], [0.70, 0.80, 48],
      [0.82, 0.54, 42], [0.94, 0.26, 32]
    ];
    for (var b = 0; b < branchSpec.length; b++) {
      var frac = branchSpec[b][0], angMag = branchSpec[b][1], limbLen = branchSpec[b][2];
      var startJ = Math.min(trunkTop, Math.max(0, Math.round(frac * cfg.segs) - 1));
      var dir = b % 2 ? -1 : 1;
      var ang = dir * (angMag + rnd(rng, -0.06, 0.06));
      var wJ = Math.max(4, Math.round(joints[startJ].w * 0.72));
      var limb = grow(startJ, ang, limbLen + rnd(rng, -4, 4), 3, wJ, dir * 0.04, 0.02);
      for (var f = 0; f < 2; f++) {
        var forkDir = f ? -1 : 1;
        var twigAng = ang + forkDir * rnd(rng, 0.22, 0.42);
        var twig = grow(limb, twigAng, rnd(rng, 20, 30), 2,
          Math.max(2, wJ - 2), forkDir * dir * 0.08, 0.024);
        if (rng() < 0.8) {
          grow(twig, twigAng + forkDir * rnd(rng, 0.14, 0.34),
            rnd(rng, 14, 20), 1, 2, forkDir * dir * 0.07, 0.019);
        }
      }
    }

    /* 花团长在枝梢上，枝从缝里露出来 */
    function nearestJoint(px, py) {
      var near = 0, nd = 1e9;
      for (var ji = 0; ji < joints.length; ji++) {
        var dd = Math.hypot(joints[ji].rx - px, joints[ji].ry - py) + joints[ji].level * 0.6;
        if (dd < nd) { nd = dd; near = ji; }
      }
      return near;
    }
    var blossomSprites = [makeBlossom(rng), makeBlossom(rng), makeBlossom(rng),
      makeBlossom(rng), makeBlossom(rng), makeBlossom(rng)];
    /* 冠子：横着铺开，比树高宽得多，上缘略塌 */
    var crown = { x: spec.baseX, y: spec.baseY - 132, rx: 132, ry: 70 };

    function crownMaxR(ny) {
      if (ny < 0) return Math.pow(1 + ny, 0.62) * 1.06;
      return 1 - 0.30 * ny * ny;
    }

    function pushAt(px, py, sp, back, edge) {
      var nj = nearestJoint(px, py);
      clusters.push({
        joint: nj,
        ox: Math.round(px - joints[nj].rx),
        oy: Math.round(py - joints[nj].ry),
        sp: sp, back: !!back, edge: edge, state: "on", jitter: rng() * 0.03
      });
    }

    /* 冠体：一堆小碎块，块之间留缝，枝子从缝里露出来 */
    var balls = [], tries = 0;
    while (balls.length < 430 && tries < 80000) {
      tries++;
      var ny = rng() * 2 - 1;
      var lim = crownMaxR(ny);
      var nx = (rng() * 2 - 1) * lim;
      if (Math.abs(nx) > lim * 0.96) continue;
      var px = crown.x + nx * crown.rx;
      var py = crown.y + ny * crown.ry;
      if (py < 10 || py > spec.baseY - 24 - rng() * 20) continue;
      var clear = true;
      for (var k2 = 0; k2 < balls.length; k2++) {
        var ddx = balls[k2].x - px, ddy = balls[k2].y - py;
        if (ddx * ddx + ddy * ddy < 2.9 * 2.9) { clear = false; break; }
      }
      if (!clear) continue;
      balls.push({ x: px, y: py, r: Math.round(rnd(rng, 6, 10)),
        tone: clamp(0.75 - ny * 1.9, -1.2, 1.3) });
    }
    for (var bi = 0; bi < balls.length; bi++) {
      var B = balls[bi];
      pushAt(B.x, B.y, makeFlowerBall(rng, B.r, B.tone), true, 1);
    }

    /* 冠心里先垫几团底色，碎块才连得起来 */
    for (var cp = 0; cp < 104; cp++) {
      var cny = rng() * 1.5 - 0.75, clim = crownMaxR(cny);
      var cnx = (rng() * 2 - 1) * clim * 0.82;
      var cpx = crown.x + cnx * crown.rx, cpy = crown.y + cny * crown.ry;
      if (cpy > spec.baseY - 40) continue;
      pushAt(cpx, cpy, makeFlowerBall(rng, Math.round(rnd(rng, 4, 8)), -0.95), true, 1);
    }

    /* 枝子上面再压一层花块：白花状态不再把枝条一眼看穿，只留几道缝 */
    for (var fp = 0; fp < balls.length; fp++) {
      var FP = balls[fp];
      if (rng() > 0.52) continue;
      if (rng() < 0.1) continue;
      pushAt(FP.x + rnd(rng, -1.6, 1.6), FP.y + rnd(rng, -1.6, 1.6),
        makeFlowerBall(rng, Math.round(rnd(rng, 4, 8)), FP.tone * 0.92), false, 1);
    }

    /* 零散的花：只有花没有块，勾毛边 */
    var blooms = 0, btries = 0;
    while (blooms < 190 && btries < 14000) {
      btries++;
      var bny = rng() * 2 - 1;
      var blim = crownMaxR(bny);
      var bnx = (rng() * 2 - 1) * blim * 1.05;
      var bdd = Math.abs(bnx) / blim;
      if (bdd < 0.6 && rng() < 0.4) continue;
      var bpx = crown.x + bnx * crown.rx;
      var bpy = crown.y + bny * crown.ry;
      if (bpy < 6 || bpy > spec.baseY - 26) continue;
      pushAt(bpx, bpy, pick(rng, blossomSprites), false, clamp(bdd + 0.2, 0.2, 1));
      blooms++;
    }

    /* 冠底垂下的几簇，破掉平齐的边 */
    for (var hb = 0; hb < 34; hb++) {
      var hx = crown.x + (rng() * 2 - 1) * crown.rx * 0.72;
      var hy = crown.y + crown.ry * (0.70 + rng() * 0.52);
      if (hy > spec.baseY - 10) continue;
      pushAt(hx, hy,
        rng() < 0.6 ? pick(rng, blossomSprites)
                    : makePuff(rng, Math.round(rnd(rng, 3, 5)), PAL.bloom, -0.9),
        rng() < 0.5, 1);
    }

    /* 枝梢再点几朵，花别离开枝子 */
    for (var ji = 0; ji < joints.length; ji++) {
      var j = joints[ji];
      if (j.level < 2) continue;
      for (var bb = 0; bb < 2; bb++) {
        var ab = rng() * 6.283, rb = Math.sqrt(rng()) * 10;
        pushAt(j.rx + Math.cos(ab) * rb, j.ry + Math.sin(ab) * rb,
          pick(rng, blossomSprites), false, 1);
      }
    }

    /* 冠外零星的碎花瓣，勾毛边：只贴在花冠轮廓上，别飘到外面像悬空的叶子 */
    for (var sp = 0; sp < 40; sp++) {
      var a4 = rng() * Math.PI * 2;
      var rr4 = 0.94 + rng() * 0.09;
      var px3 = crown.x + Math.cos(a4) * crown.rx * rr4;
      var py3 = crown.y + Math.sin(a4) * crown.ry * rr4;
      if (py3 > spec.baseY - 14 || py3 < 6) continue;
      var nj3 = nearestJoint(px3, py3);
      clusters.push({
        joint: nj3,
        ox: Math.round(px3 - joints[nj3].rx),
        oy: Math.round(py3 - joints[nj3].ry),
        sp: makeFaller(rng, "petal"), back: false, edge: 1, state: "on",
        jitter: rng() * 0.03, tiny: true
      });
    }

    /* 地上的落花：贴着根堆成一条落叶带，越远越稀（背景在另一张画布上） */
    var gctx = ground.getContext("2d");
    gctx.imageSmoothingEnabled = false;
    /* 树根压在地上的一小圈暗影，先铺在落叶堆底下 */
    var shadow = [[30, 0.09], [22, 0.12], [14, 0.16], [8, 0.19]];
    for (var sh = 0; sh < shadow.length; sh++) {
      gctx.fillStyle = "rgba(8,12,20," + shadow[sh][1] + ")";
      gctx.fillRect(Math.round(spec.baseX - shadow[sh][0] / 2), spec.baseY + 2 + sh, shadow[sh][0], 1);
    }
    /* 落叶堆：逐列定高度——根下堆得最厚，±150 处收成 0，面上留些透气的小洞 */
    for (var lx = -208; lx <= 208; lx++) {
      var dxr = Math.abs(lx) / 208;
      var hmax = Math.round((1 - Math.pow(dxr, 0.8)) * 7 + rng() * 1.6);
      if (dxr > 0.5 && rng() < dxr * 0.6) hmax -= 1;
      for (var lk = 0; lk < hmax; lk++) {
        if (rng() < 0.14) continue;
        var ly = spec.baseY + 2 - lk;
        gctx.fillStyle = pick(rng, PAL.soil);
        gctx.fillRect(spec.baseX + lx, ly, rng() < 0.3 ? 2 : 1, 1);
        if (rng() < 0.16) {                       /* 偶尔一颗胭脂色的花心 */
          gctx.fillStyle = rng() < 0.5 ? "#E4A9B8" : "#D98CA0";
          gctx.fillRect(spec.baseX + lx, ly, 1, 1);
        }
      }
      /* 前沿再撒几粒，堆的下沿才不是一条直线 */
      if (rng() < 0.34) {
        gctx.fillStyle = pick(rng, PAL.soil);
        gctx.fillRect(spec.baseX + lx, spec.baseY + 3 + Math.round(rng() * 3), 1, 1);
      }
    }
