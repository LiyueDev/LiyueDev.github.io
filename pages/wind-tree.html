    for (var s2b = 0; s2b < 46; s2b++) {
      var gx2 = Math.round(spec.baseX + (rng() - 0.5) * 262);
      var gy2 = spec.baseY + 1 + Math.round(Math.pow(rng(), 1.5) * 7);
      if (gy2 >= spec.h) continue;
      gctx.fillStyle = pick(rng, PAL.soil);
      gctx.fillRect(gx2, gy2, rng() < 0.25 ? 2 : 1, 1);
    }

    var canvas = document.createElement("canvas");
    /* 画布按留白后的尺寸开，树在里面偏下偏右一点，甩出去也还在画布里 */
    canvas.width = SC_W; canvas.height = SC_H;
    var ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    return {
      spec: spec, joints: joints, clusters: clusters, crown: crown,
      fallers: [makeFaller(rng, "petal"), makeFaller(rng, "petal"), makeFaller(rng, "flower")],
      leafSprites: [makeLeafSprite(rng, false), makeLeafSprite(rng, true)],
      bushes: BUSHES.map(function (BS) {
        return { x: spec.baseX + BS.dx, y: spec.baseY - 4 + BS.dy, w: BS.w, h: BS.h, timer: Math.random() * 2.4 };
      }),
      ground: ground, canvas: canvas, ctx: ctx,
      /* 地上的落叶：落下来的花都堆进这张 ground 画布，不凭空消失 */
      gctx: gctx, pileH: {}, pileN: 0,
      events: [], leaves: [], blowTimer: 0, ambTimer: 0, recover: 0, shakeCount: 0,
      /* ambT：点过树之后才开的多飘一会儿的窗口，默认 0 就是“不点不掉” */
      ambT: 0,
      /* 灌木在树画布里的横向占位，落花堆到这儿要让开（layout 里按实际比例算） */
      bushGuard: []
    };
  }

  /* 首屏就按当前主题取色，别默认当暗色 */
  applyPalette((document.getElementById("frame") || { dataset: {} }).dataset.theme !== "light");
  var plant = buildPlant(SPEC);

  /* ================= 风 ================= */
  var wind = {
    direction: 1, strength: 0, gusts: 0.45, speed: 0, t: 0,
    /* manual：只有用户自己在设置台动过风速/阵风，树叶才会被吹落。
       默认（含开场的大风）只让树身随风摆、花不掉，免得一开页就秃。 */
    manual: false,
    set: function (o) {
      if (o.direction !== undefined) this.direction = o.direction;
      if (o.strength !== undefined) this.strength = o.strength;
      if (o.gusts !== undefined) this.gusts = o.gusts;
    },
    get active() { return this.strength > 0; },
    step: function (dt) {
      this.t += dt;
      var swell = Math.sin(this.t * 1.05) * 0.6 + Math.sin(this.t * 2.31 + 1.2) * 0.4;
      var target = this.direction * this.strength * (1 + this.gusts * 0.85 * swell);
      this.speed += (target - this.speed) * Math.min(1, dt * 2.6);
      if (Math.abs(this.speed) < 0.0015) this.speed = 0;
    }
  };

  /* ================= 骨架求解 ================= */
  function updatePose(p, t) {
    var wl = wind.speed;
    for (var i = 0; i < p.joints.length; i++) {
      var j = p.joints[i];
      var local = 0;
      if (wl !== 0) {
        local += wl * j.bend * (0.85 + 0.4 * Math.sin(t * (1.15 + j.depth * 0.17) + j.phase));
      }
      local += Math.sin(t * 3.2 + j.phase) * 0.006 * Math.abs(wl);
      for (var e = 0; e < p.events.length; e++) {
        var ev = p.events[e], age = t - ev.t0;
        if (age < 0 || age > 2.8) continue;
        var d = Math.sqrt((j.rx - ev.x) * (j.rx - ev.x) + (j.ry - ev.y) * (j.ry - ev.y));
        local += ev.power * Math.exp(-d / 78) * Math.exp(-3.4 * age) * Math.sin(8.6 * age - d * 0.075);
      }
      if (p.drag && p.drag.joint === i) local += p.drag.angle;

      j.rot = (j.parent >= 0 ? p.joints[j.parent].rot : 0) + local;
      var c = Math.cos(j.rot), s = Math.sin(j.rot);
      if (j.parent < 0) {
        j.wx = p.spec.baseX + (j.dx * c - j.dy * s);
        j.wy = p.spec.baseY + (j.dx * s + j.dy * c);
      } else {
        var par = p.joints[j.parent];
        j.wx = par.wx + j.dx * c - j.dy * s;
        j.wy = par.wy + j.dx * s + j.dy * c;
      }
    }
    if (p.events.length) p.events = p.events.filter(function (ev) { return t - ev.t0 < 2.8; });
  }

  function drawClusters(p, back) {
    var ctx = p.ctx;
    for (var i = 0; i < p.clusters.length; i++) {
      var c = p.clusters[i];
      if (c.state !== "on" || !!c.back !== back) continue;
      var j = p.joints[c.joint];
      var co = Math.cos(j.rot), si = Math.sin(j.rot);
      var x = Math.round(j.wx + c.ox * co - c.oy * si);
      var y = Math.round(j.wy + c.ox * si + c.oy * co);
      ctx.drawImage(c.sp.cv, x - c.sp.ox, y - c.sp.oy);
    }
  }

  function drawWood(p, loLevel, hiLevel) {
    var ctx = p.ctx, bark = PAL.bark;
    for (var i = 0; i < p.joints.length; i++) {
      var j = p.joints[i];
      if (j.parent < 0) continue;
      if (j.level < loLevel || j.level > hiLevel) continue;
      var q = p.joints[j.parent];
      var dx = j.wx - q.wx, dy = j.wy - q.wy;
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len < 0.5) continue;
      /* 沿主轴逐行扫描：一段枝从一个节走到下一个节，边是连续的，
         弯折处也不会因为 2px 横条错位而出现碎口 */
      var w0 = q.w, w1 = j.w;
      var vert = Math.abs(dy) >= Math.abs(dx);
      /* 主干和大枝：宽度取偶数、两侧压暗，一块一块像手画出来的 */
      var heavy = j.level <= 1;
      /* 逐行（逐列）地走过整段：端点取整后一行不漏，
         两段相接的那一行由前一段的末行和后一段的首行各画一次，缝就补上了 */
      var bar = function (t, fixed) {
        var w = Math.max(2, Math.round(w0 + (w1 - w0) * t));
        if (heavy) w = w % 2 ? w + 1 : w;
        var half = w / 2;
        if (vert) {
          var x = Math.round(q.wx + dx * t);
          if (heavy) {
            ctx.fillStyle = bark[0];
            ctx.fillRect(x - half, fixed, w, 1);
            ctx.fillStyle = bark[1];
            ctx.fillRect(x - half + 1, fixed, w - 2, 1);
            if (fixed % 7 < 3) {
              ctx.fillStyle = bark[2];
              ctx.fillRect(x - half + 1, fixed, 1, 1);
            }
          } else {
            ctx.fillStyle = bark[1];
            ctx.fillRect(x - half, fixed, w, 1);
            ctx.fillStyle = bark[2];
            ctx.fillRect(x - half, fixed, 1, 1);
            ctx.fillStyle = bark[0];
            ctx.fillRect(x - half + w - 1, fixed, 1, 1);
          }
        } else {
          var yy = Math.round(q.wy + dy * t);
          if (heavy) {
            ctx.fillStyle = bark[0];
            ctx.fillRect(fixed, yy - half, 1, w);
            ctx.fillStyle = bark[1];
            ctx.fillRect(fixed, yy - half + 1, 1, w - 2);
            if (fixed % 7 < 3) {
              ctx.fillStyle = bark[2];
              ctx.fillRect(fixed, yy - half + 1, 1, 1);
            }
          } else {
            ctx.fillStyle = bark[1];
            ctx.fillRect(fixed, yy - half, 1, w);
            ctx.fillStyle = bark[2];
            ctx.fillRect(fixed, yy - half, 1, 1);
            ctx.fillStyle = bark[0];
            ctx.fillRect(fixed, yy + half - 1, 1, 1);
          }
        }
      }
      if (vert) {
        var yA = Math.round(q.wy), yB = Math.round(j.wy);
        var yStep = yB >= yA ? 1 : -1;
        var ySpan = (j.wy - q.wy) || 1;
        for (var yv = yA; ; yv += yStep) {
          bar(clamp((yv - q.wy) / ySpan, 0, 1), yv);
          if (yv === yB) break;
        }
      } else {
        var xA = Math.round(q.wx), xB = Math.round(j.wx);
        var xStep = xB >= xA ? 1 : -1;
        var xSpan = (j.wx - q.wx) || 1;
        for (var xv = xA; ; xv += xStep) {
          bar(clamp((xv - q.wx) / xSpan, 0, 1), xv);
          if (xv === xB) break;
        }
      }

      /* 关节处补一块，把折角外侧的缺口缝上 */
      var wk = Math.max(q.w, j.w);
      if (wk % 2) wk += 1;
      var hw = wk / 2;
      ctx.fillStyle = bark[1];
      ctx.fillRect(Math.round(j.wx) - hw, Math.round(j.wy) - 1, wk, 3);
      if (heavy) {
        ctx.fillStyle = bark[0];
        ctx.fillRect(Math.round(j.wx) - hw, Math.round(j.wy) - 1, 1, 3);
        ctx.fillRect(Math.round(j.wx) + hw - 1, Math.round(j.wy) - 1, 1, 3);
      }

      /* 树干基部：一路画到地面，越往下越宽，像从土里长出来的一截 */
      /* 树干基部：一路画到地面，越往下越宽，像从土里长出来的一截 */
      if (q.parent < 0) {
        var yTop = Math.round(q.wy), yBot = Math.round(p.spec.baseY) + 1;
        if (q.level === 0 && yBot > yTop) {
          var span = Math.max(1, yBot - yTop);
          var bwRow = Math.round(q.w + 1);
          for (var by = yTop; by <= yBot; by++) {
            var bt = (by - yTop) / span;
            var bt2 = clamp((bt - 0.18) / 0.82, 0, 1);
            bwRow = Math.round(q.w + 1 + bt2 * bt2 * 6);
            if (bwRow % 2) bwRow += 1;
            var bh = bwRow / 2, bx = Math.round(q.wx);
            ctx.fillStyle = bark[0];
            ctx.fillRect(bx - bh, by, bwRow, 1);
            ctx.fillStyle = bark[1];
            ctx.fillRect(bx - bh + 1, by, bwRow - 2, 1);
            if (by % 9 < 3) {                            /* 竖纹不要太密，别像拉链 */
              ctx.fillStyle = bark[2];
              ctx.fillRect(bx - bh + 1, by, 1, 1);
            }
          }
          /* 根：底部三行一层层往外鼓，底边压暗，才像抓着地 */
          var gyy = Math.round(p.spec.baseY), bhR = Math.round(bwRow / 2), bxx = Math.round(q.wx);
          var rootRows = [[2, 2], [1, 4], [0, 6]];
          for (var rr2 = 0; rr2 < rootRows.length; rr2++) {
            var up = rootRows[rr2][0], ex = rootRows[rr2][1];
            var ry2 = gyy - up;
            ctx.fillStyle = bark[1];
            ctx.fillRect(bxx - bhR - ex, ry2, bhR + ex, 1);
            ctx.fillRect(bxx + 1, ry2, bhR + ex - 1, 1);
            ctx.fillStyle = bark[0];
            ctx.fillRect(bxx - bhR - ex, ry2 + 1, ex + 2, 1);
            ctx.fillRect(bxx + bhR - 2, ry2 + 1, ex + 2, 1);
          }
          /* 几块零星的根疙瘩，左右不对称 */
          ctx.fillStyle = bark[0];
          ctx.fillRect(bxx - bhR - 8, gyy - 1, 3, 2);
          ctx.fillRect(bxx + bhR + 5, gyy - 2, 2, 2);
        }
      }
    }
  }

  function drawFalling(p) {
    var ctx = p.ctx;
    for (var i = 0; i < p.leaves.length; i++) {
      var l = p.leaves[i];
      var x = Math.round(l.x), y = Math.round(l.y);
      var land = l.land || (p.spec.baseY + 3);
      var fd = l.fade || (l.kind === "leaf" ? 6 : 3);
      var a = 1;
      if (l.y > land - fd) a = clamp((land - l.y) / fd, 0, 1);
      if (a <= 0) continue;
      if (a < 1) ctx.globalAlpha = a;
      if (l.flip) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(-1, 1);
        ctx.drawImage(l.sp.cv, -l.sp.ox, -l.sp.oy);
        ctx.restore();
      } else {
        ctx.drawImage(l.sp.cv, x - l.sp.ox, y - l.sp.oy);
      }
      if (a < 1) ctx.globalAlpha = 1;
    }
  }

  function plantX(p, c) {
    var j = p.joints[c.joint];
    var co = Math.cos(j.rot), si = Math.sin(j.rot);
    return { x: j.wx + c.ox * co - c.oy * si, y: j.wy + c.ox * si + c.oy * co };
  }

  function spawnLeaf(p, c, boost) {
    if (p.leaves.length > 260) return;
    var pos = plantX(p, c);
    p.leaves.push({
      sp: p.fallers[Math.floor(Math.random() * p.fallers.length)],
      x: pos.x + (Math.random() - 0.5) * 3,
      y: pos.y,
      /* 初速就带风的横向分速度，别一出手就是垂直往下 */
      vx: wind.speed * 52 + (Math.random() - 0.5) * 24 + (boost || 0),
      vy: 0.5 + Math.random() * 1.5,
      /* 花瓣轻：下落加速度小、横向风加速度大，才看得出“被吹着走” */
      g: 9 + Math.random() * 4,
      wk: 120,
      sway: 10,
      ph: Math.random() * 6.28,
      t: 0,
      kind: "petal",
      life: 9,
      flip: Math.random() < 0.5
    });
  }

  function detach(p, c, boost) {
    if (c.state !== "on") return false;
    c.state = "off";
    c.offAt = performance.now();
    spawnLeaf(p, c, boost);
    return true;
  }

  /* 连点会越掉越多：停手 2 秒回到起步量 */
  var tap = { n: 0, last: -9 };
  function tapBurst(t) {
    if (t - tap.last > 2) tap.n = 0;
    tap.n = Math.min(tap.n + 1, 6);
    tap.last = t;
    return 3 + tap.n * 3;          /* 6 → 9 → 12 → 15 → 18 → 21 */
  }

  function shakePlant(p, x, y, t, count) {
    p.events.push({ x: x, y: y, t0: t, power: 0.046 });
    var on = p.clusters.filter(function (c) { return c.state === "on"; });
    if (!on.length) return;
    var scored = on.map(function (c) {
      var pos = plantX(p, c);
      var d = Math.sqrt((pos.x - x) * (pos.x - x) + (pos.y - y) * (pos.y - y));
      /* 先掉边上的碎花瓣和小花，整团的花球落得少，树不会一下子秃 */
      var light = c.tiny ? 2.2 : (c.sp.cv.width > 20 ? 0.5 : 1.15);
      return { c: c, k: Math.random() * light * (1 + c.edge * 0.6) / Math.max(9, d) };
    });
    scored.sort(function (a, b) { return b.k - a.k; });
    var n = clamp(count || 3, 1, 26);
    var sgn = wind.speed > 0.05 ? 1 : (wind.speed < -0.05 ? -1 : 0);
    for (var i = 0; i < n && i < scored.length; i++) {
      detach(p, scored[i].c, sgn * (6 + Math.random() * 8));
    }
    /* 点完再飘一小会儿，随后彻底安静下来 */
    p.ambT = Math.max(p.ambT, 1.5 + n * 0.06);
  }

  function windDetach(p, dt, t) {
    if (!wind.manual) return;
    if (Math.abs(wind.speed) < 0.15) return;
    p.blowTimer -= dt;
    if (p.blowTimer > 0) return;
    p.blowTimer = 0.26 + Math.random() * 0.44;
    var on = p.clusters.filter(function (c) { return c.state === "on"; });
    if (!on.length) return;
    var sgn = Math.sign(wind.speed);
    for (var i = 0; i < 2; i++) {
      var best = null, bw = -1;
      for (var s = 0; s < 7; s++) {
        var c = on[Math.floor(Math.random() * on.length)];
        if (!c || c.state !== "on") continue;
        var j = p.joints[c.joint];
        var windward = sgn > 0 ? (j.rx + c.ox - p.spec.baseX) / 90 : (p.spec.baseX - (j.rx + c.ox)) / 90;
        var wv = c.edge + Math.random() * 0.5 + windward * 0.5;
        if (wv > bw) { bw = wv; best = c; }
      }
      if (best && Math.random() < 0.18 + 0.42 * Math.abs(wind.speed)) detach(p, best);
    }
  }

  function regrow(p, t) {
    var off = p.clusters.filter(function (c) { return c.state !== "on"; });
    off.sort(function (a, b) { return a.joint - b.joint || Math.random() - 0.5; });
    off.forEach(function (c, i) {
      c.state = "pending";
      c.at = t + 0.03 + (i / Math.max(1, off.length)) * 1.6;
    });
  }

  /* 落地的花不消失：堆进 ground 画布，越堆越高，堆成一条落叶带 */
  function pileAt(p, l) {
    if (!p.gctx || p.pileN > 2600) return;
    var gx = Math.round(l.x), gy = Math.round(p.spec.baseY + 1);
    if (gx < 4 || gx > p.spec.w - 4) return;
    /* 灌木站在同一条地平线上，而且是画在背景层的 —— 落花要是画上去就把草丛糊住了，
       所以灌木占的那几段不堆花，让草丛完整露出来 */
    var gu = p.bushGuard;
    if (gu) {
      for (var gi = 0; gi < gu.length; gi++) {
        if (gx > gu[gi][0] && gx < gu[gi][1]) return;
      }
    }
    var col = Math.floor(gx / 2);
    var h = p.pileH[col] || 0;
    if (h > 6) return;
    var tones = l.kind === "leaf" ? PAL.grass : PAL.soil;
    p.pileN++;
    var gctx = p.gctx;
    gctx.fillStyle = tones[1 + Math.floor(Math.random() * 2)] || tones[0];
    gctx.fillRect(gx, gy - h, 1, 1);
    if (Math.random() < 0.35) {
      gctx.fillRect(gx + (Math.random() < 0.5 ? 1 : -1), gy - h, 1, 1);
    }
    if (Math.random() < 0.5 && l.kind !== "leaf") {
      gctx.fillStyle = Math.random() < 0.5 ? "#E4A9B8" : "#D98CA0";
      gctx.fillRect(gx, gy - h, 1, 1);
    }
    p.pileH[col] = h + (Math.random() < 0.62 ? 1 : 0);
    /* 堆高了就往两边摊，才不像一根柱子 */
    if (h >= 2 && Math.random() < 0.55) {
      var nb = col + (Math.random() < 0.5 ? 1 : -1);
      p.pileH[nb] = Math.min(5, (p.pileH[nb] || 0) + 1);
    }
  }

  function stepLeaves(p, dt) {
    for (var i = p.leaves.length - 1; i >= 0; i--) {
      var l = p.leaves[i];
      l.t += dt;
      /* 风先把横向速度加满，上限随风力走：没风只微飘，起风才真的往左/往右推 */
      var vmax = 18 + 62 * Math.abs(wind.speed);
      l.vx = clamp(l.vx + wind.speed * (l.wk || 44) * dt, -vmax, vmax);
      l.vy = Math.min(l.vy + (l.g || 22) * dt, 24);
      l.x += (l.vx + Math.sin(l.t * 2.4 + l.ph) * (l.sway || (l.amb ? 5 : 7))) * dt;
      l.y += l.vy * dt;
      var land = l.land || (p.spec.baseY + 3);
      if (l.y >= land) {
        pileAt(p, l);                    /* 落地的那一瓣，堆进土里 */
        p.leaves.splice(i, 1);
      } else if (l.x < -14 || l.x > p.spec.w + 14) {
        p.leaves.splice(i, 1);           /* 被风刮出画外的，别留在数组里悬着 */
      } else if (l.t > (l.life || 7)) {
        p.leaves.splice(i, 1);
      }
    }
  }

  /* 自然落瓣：平时一直有，但下得很慢（一两秒才松一瓣），落得也干净利落，
     所以是“树下偶尔飘一朵”，不是漫天碎屑悬在空中；
     点过树之后（p.ambT>0）才短时间掉得密一点，接上那阵摇落的花。 */
  function ambientFall(p, dt) {
    p.ambTimer -= dt;
    if (p.ambTimer > 0) return;
    var hot = p.ambT > 0;
    var w = Math.min(1, Math.abs(wind.speed) * 1.1 + Math.abs(wind.gusts) * 0.3);
    p.ambTimer = hot
      ? (0.09 + Math.random() * 0.11) * (1 - 0.25 * w)
      : (0.045 + Math.random() * 0.085) * (1 - 0.2 * w);
    if (p.leaves.length > (hot ? 320 : 260)) return;
    var cw = p.crown;
    var a = Math.random() * 6.283;
    var rr = 0.35 + Math.sqrt(Math.random()) * 0.65;
    /* 大半从树冠下半松手，落下来才在眼里 */
    var down = Math.random() < 0.62 ? Math.abs(Math.sin(a)) : Math.sin(a);
    var px = cw.x + Math.cos(a) * cw.rx * rr;
    var py = cw.y + down * cw.ry * 0.9 * rr;
    if (py > p.spec.baseY - 32) py = p.spec.baseY - 32;
    p.leaves.push({
      sp: p.fallers[Math.random() < 0.8 ? 0 : 1],
      x: px, y: py,
      vx: wind.speed * 60 + (Math.random() - 0.5) * 8,
      vy: 0.9 + Math.random() * 1.3,
      g: 11 + Math.random() * 4,
      wk: 120,
      sway: 7,
      ph: Math.random() * 6.283,
      t: 0, life: 7, amb: true,
      kind: "petal",
      flip: Math.random() < 0.5
    });
  }

  /* 灌木也在掉叶子：一小片一小片，落在自己的根边 */
  function bushFall(p, dt) {
    var bs = p.bushes;
    if (!bs) return;
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      b.timer -= dt;
      if (b.timer > 0) continue;
      b.timer = 2.6 + Math.random() * 3.6;
      if (p.leaves.length > 220) continue;
      p.leaves.push({
        sp: p.leafSprites[Math.random() < 0.5 ? 0 : 1],
        x: b.x + (Math.random() - 0.5) * b.w * 0.84,
        y: b.y - b.h + 1 + Math.random() * 3,
        vx: wind.speed * 14 + (Math.random() - 0.5) * 4,
        vy: 0.2 + Math.random() * 0.4,
        g: 7 + Math.random() * 7,
        ph: Math.random() * 6.283,
        t: 0, life: 7, amb: true,
        kind: "leaf",
        sway: 3, wk: 16,
        land: b.y + 2 + Math.random() * 5, fade: 6,
        flip: Math.random() < 0.5
      });
    }
  }

  /* 点掉的花，过一会儿自己悄悄补一点回来，不至于几下就秃 */
  function slowRegrow(p, t, dt) {
    p.recover -= dt;
    if (p.recover > 0) return;
    p.recover = 4.2 + Math.random() * 2.6;
    var gone = null;
    for (var i = 0; i < p.clusters.length; i++) {
      var c = p.clusters[i];
      if (c.state !== "off") continue;
      if (!gone || (c.offAt || 0) < (gone.offAt || 0)) gone = c;
    }
    if (gone) { gone.state = "pending"; gone.at = t + 0.3; }
  }

  function stepPlant(p, t, dt) {
    updatePose(p, t);
    if (wind.active) windDetach(p, dt, t);
    if (p.ambT > 0) p.ambT -= dt;
    /* 平时也有自然落瓣，只是很疏；点过树之后密一阵子再收回去 */
    ambientFall(p, dt);
    bushFall(p, dt);
    slowRegrow(p, t, dt);
    for (var i = 0; i < p.clusters.length; i++) {
      var c = p.clusters[i];
      if (c.state === "pending" && t >= c.at) c.state = "on";
    }
    stepLeaves(p, dt);
  }

  function paintPlant(p) {
    var ctx = p.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, p.canvas.width, p.canvas.height);
    /* 画布比树大一圈，所有绘制统一推到留白位置 */
    ctx.setTransform(1, 0, 0, 1, PAD_X, PAD_Y);
    ctx.drawImage(p.ground, 0, 0);
    drawWood(p, 3, 99);
    drawClusters(p, true);
    drawWood(p, 0, 2);
    drawClusters(p, false);
    drawFalling(p);
  }

  function remaining(p) {
    var n = 0;
    for (var i = 0; i < p.clusters.length; i++) if (p.clusters[i].state !== "off") n++;
    return n;
  }

  /* ================= DOM ================= */
  var frame = document.getElementById("frame");
  if (/[?&]embed/.test(location.search)) frame.setAttribute("data-embed", "true");
  var stage = document.getElementById("stage");
  var scene = document.getElementById("scene");
  var sceneCtx = scene.getContext("2d");
  var back = document.getElementById("back");
  var backCtx = back.getContext("2d");
  /* 会动的那一层：海、星、月，压在静态底图上面、树后面 */
  var animCv = document.getElementById("backAnim");
  var animCtx = animCv.getContext("2d");
  var backW = 0, backH = 0, backForce = true, backAX = 0, backAY = 0, backMode = "";
  var stageLeft = 0, stageTop = 0;
  var growBtn = document.getElementById("grow");
  var statusEl = document.getElementById("status");
  var speedTrack = document.getElementById("speedTrack");
  var gustTrack = document.getElementById("gustTrack");
  var speedValue = document.getElementById("speedValue");
  var gustValue = document.getElementById("gustValue");

  /* bg：几何 / 海边；preset 是「下次起风用哪一档」，开场先无风，档位停在微风 */
  var state = { theme: "light", preset: "breezy", bg: "solid" };
  frame.dataset.bg = state.bg;
  var sceneScale = 2, ready = false;
  /* 单独打开时把树收一点，画面留白更多；嵌在作品卡预览里维持原尺寸。
     手机上按屏幕比例再调：竖屏放大占满宽度，横屏矮屏收紧，别顶到工作台。 */
  function computeShrink() {
    if (frame.dataset.embed === "true") return 1;
    var w = window.innerWidth, h = window.innerHeight;
    if (w > h && h < 560) return 0.72;   // 横屏手机：给工作台让出高度
    if (w < 760) return 1;               // 竖屏手机 / 窄窗
    return 0.84;
  }

  /* 手机竖屏再往上顶一档：树本来就只占画布中间 264px（两边是留白），
     允许画面横向溢出舞台被裁掉一点，树就真的变大了，而不是被整数缩放卡住 */
  function phoneBoost() {
    if (frame.dataset.embed === "true") return 1;
    var w = window.innerWidth, h = window.innerHeight;
    if (w >= h) return 1;
    if (w < 480) return 1.3;
    if (w < 760) return 1.16;
    return 1;
  }

  /* 手机浏览器（竖屏窄屏）：默认进夜晚海边；桌面维持浅色纯色 */
  function isPhoneScreen() {
    var w = window.innerWidth, h = window.innerHeight;
    var coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
    if (h > w && w < 520) return true;
    return coarse && Math.min(w, h) < 620;
  }

  var colorCache = { ink: "#000" };
  function refreshColors() {
    var cs = getComputedStyle(frame);
    colorCache.ink = cs.getPropertyValue("--pp-ink").trim() || "#000";
  }

  /* ---------- 布景 ---------- */
  function layout() {
    var dpr = DPR();
    var w = stage.clientWidth, h = stage.clientHeight;
    var availW = Math.max(120, w - 24);
    var availH = Math.max(120, h - 28);
    var boost = phoneBoost();
    var wantW = 0, k = 0, scale = 1;
    if (boost > 1) {
      /* 竖屏手机：先定“这张画要占多宽”（css px，可以溢出舞台被裁一点），
         再反推位图倍数 k —— k 只决定清晰度，显示尺寸不再被整数缩放卡死 */
      wantW = Math.round(Math.max(120, Math.min(availW * computeShrink() * boost, availH * (SC_W / SC_H))));
      k = Math.ceil(wantW * dpr / SC_W);
    } else {
      k = Math.floor(Math.min(availW * dpr / SC_W, availH * dpr / SC_H));
    }
    k = Math.max(1, Math.min(k, Math.ceil(4 * dpr)));
    sceneScale = k;
    scene.width = SC_W * k; scene.height = SC_H * k;
    var rawW = scene.width / dpr, rawH = scene.height / dpr;
    if (wantW) {
      scale = Math.min(wantW / rawW, availH / rawH, 1);
    } else {
      scale = Math.min(computeShrink(), availW / rawW, availH / rawH, 1);
    }
    var cssWf = Math.round(rawW * scale), cssH = Math.round(rawH * scale);
    scene.style.width = cssWf + "px"; scene.style.height = cssH + "px";
    var left = Math.round((w - cssWf) / 2);
    var top = Math.round(Math.max(6, (h - cssH) / 2 - (h < 480 ? 16 : 6) - (wantW ? cssH * 0.07 : 0)));
    scene.style.left = left + "px"; scene.style.top = top + "px";
    stageLeft = left; stageTop = top;
    /* 树根那条基准线：几何背景里的横线要正好从树干底下过 */
    stage.style.setProperty("--pp-base", Math.round(top + cssH * ((PAD_Y + SPEC.baseY) / SC_H)) + "px");
    /* 灌木在背景层、按背景像素格画，先把它换算成树画布里的横向范围，
       落花堆到那儿就绕开，免得草坪被一层花瓣糊住 */
    var csBg = Math.max(1, sceneScale / dpr);
    var csX = (parseFloat(scene.style.width) || 0) / SC_W || csBg;
    var bwpx = Math.max(64, Math.round(frame.clientWidth / csBg));
    var bushK = Math.min(1, Math.max(0.5, bwpx / 420));
    var bRatio = csBg / csX;
    plant.bushGuard = BUSHES.map(function (BS) {
      var bx = SPEC.baseX + BS.dx * bushK * bRatio;
      var bh = (BS.w / 2) * 0.94 * bRatio + 6;
      return [bx - bh, bx + bh];
    });
    paintBack();
    paintScene();
  }

  /* 背景铺满整个窗口，像素格和树一样大 */
  function paintBack() {
    var dpr = DPR();
    var w = frame.clientWidth, h = frame.clientHeight;
    var cs = Math.max(1, sceneScale / dpr);
    var bw = Math.max(64, Math.round(w / cs));
    var bh = Math.max(48, Math.round(h / cs));
    /* 树根落在这张背景上的位置：按画面坐标算，草坪和灌木围着它长。
       场景画布按 SHRINK 缩放过，植物像素到画面像素的换算要用实际显示宽度。 */
    var csX = (parseFloat(scene.style.width) || 0) / SC_W || cs;
    var sr = scene.getBoundingClientRect(), fr = frame.getBoundingClientRect();
    var ax = Math.round((sr.left - fr.left + (PAD_X + SPEC.baseX) * csX) / cs);
    var ay = Math.round((sr.top - fr.top + (PAD_Y + SPEC.baseY) * csX) / cs);
    if (!backForce && bw === backW && bh === backH && ax === backAX && ay === backAY && backMode === state.bg) return;
    backW = bw; backH = bh; backAX = ax; backAY = ay; backForce = false; backMode = state.bg;
    back.width = bw; back.height = bh;
    backCtx.setTransform(1, 0, 0, 1, 0, 0);
    backCtx.clearRect(0, 0, bw, bh);
    var pal = themeDark ? BACK_NIGHT : BACK_DAY;
    if (state.bg === "solid") {
      /* 纯色模式：一整片安静的高级灰，让树独占画面 */
      backCtx.fillStyle = pal.solid;
      backCtx.fillRect(0, 0, bw, bh);
      drawSolidFloor(backCtx, bw, bh, pal, ax, ay);
      /* 切回几何时把动效那一层清干净，别留着上一张的海 */
      anim.on = false;
      anim.stars = []; anim.marks = []; anim.shimmer = []; anim.moon = null;
      animCv.width = bw; animCv.height = bh;
    } else {
      buildAnim(drawBackdrop(backCtx, bw, bh, pal, ax, ay), pal);
    }
  }

  function paintScene() {
    sceneCtx.setTransform(1, 0, 0, 1, 0, 0);
    sceneCtx.imageSmoothingEnabled = false;
    sceneCtx.clearRect(0, 0, scene.width, scene.height);
    sceneCtx.drawImage(plant.canvas, 0, 0, SC_W * sceneScale, SC_H * sceneScale);
  }

  /* ================= 主循环 ================= */
  var lastT = 0;
  function loop(now) {
    var t = now / 1000;
    if (!lastT) lastT = t;
    var dt = Math.min(0.034, Math.max(0.001, t - lastT));
    lastT = t;

    wind.step(dt);
    stepPlant(plant, t, dt);
    paintPlant(plant);
    paintScene();
    paintAnim(t);

    if (t - (loop.check || 0) > 0.25) { loop.check = t; updateGrow(); }
    if (!ready) {
      ready = true;
      statusEl.textContent = "树好了";
    }
    requestAnimationFrame(loop);
  }

  /* ================= 滑块 ================= */
  function buildTrack(el, opts) {
    el.classList.add("pp-track");
    el.setAttribute("role", "slider");
    el.setAttribute("tabindex", "0");
    el.setAttribute("aria-label", opts.label);
    el.setAttribute("aria-valuemin", "0");
    el.setAttribute("aria-valuemax", "100");
    el.innerHTML = '<span class="pp-body"><span class="pp-rail"></span><span class="pp-fill"></span></span><span class="pp-thumb"></span>';
    opts.stops.forEach(function (s) {
      if (s > 0 && s < 1) {
        var st = document.createElement("span");
        st.className = "pp-stop";
        st.style.left = (s * 100) + "%";
        el.querySelector(".pp-body").insertBefore(st, el.querySelector(".pp-fill"));
      }
    });
    var value = opts.value, dragging = false;
    function render(v, over) {
      el.style.setProperty("--v", String(v));
      el.style.setProperty("--over", (over || 0) + "px");
      el.style.setProperty("--pull", String(Math.abs(over || 0) / (el.clientWidth || 168)));
      if (over) el.style.setProperty("--origin", over < 0 ? "right" : "left");
      el.setAttribute("aria-valuenow", String(Math.round(v * 100)));
      el.setAttribute("aria-valuetext", opts.word(v));
    }
    function setValue(v, fire) {
      var g = Math.min(1, Math.max(0, v));
      var snap = opts.stops.find(function (s) { return Math.abs(s - g) < 0.035; });
      value = snap === undefined ? g : snap;
      render(value, 0);
      if (fire) opts.onInput(value);
    }
    function fromEvent(e) {
      var r = el.getBoundingClientRect();
      var v = (e.clientX - r.left) / r.width;
      var over = v < 0 ? v * r.width : (v > 1 ? (v - 1) * r.width : 0);
      var nudged = Math.sign(over) * Math.max(-26, Math.min(26, over)) * (1 - Math.exp(-Math.abs(over) / 40));
      setValue(v);
      render(value, nudged);
    }
    el.addEventListener("pointerdown", function (e) {
      dragging = true;
      el.classList.add("pp-dragging");
      el.setPointerCapture(e.pointerId);
      fromEvent(e);
    });
    el.addEventListener("pointermove", function (e) { if (dragging) fromEvent(e); });
    function end() {
      if (!dragging) return;
      dragging = false;
      el.classList.remove("pp-dragging");
      render(value, 0);
    }
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
    el.addEventListener("keydown", function (e) {
      var stepMap = { ArrowRight: 0.05, ArrowUp: 0.05, ArrowLeft: -0.05, ArrowDown: -0.05 };
      if (stepMap[e.key] !== undefined) {
        e.preventDefault();
        var dir = Math.sign(stepMap[e.key]);
        if (e.shiftKey) {
          var next = dir > 0
            ? opts.stops.find(function (s) { return s > value + 1e-6; })
            : opts.stops.slice().reverse().find(function (s) { return s < value - 1e-6; });
          setValue(next === undefined ? (dir > 0 ? 1 : 0) : next, true);
        } else {
          setValue(value + stepMap[e.key], true);
        }
      } else if (e.key === "Home" || e.key === "End") {
        e.preventDefault();
        setValue(e.key === "Home" ? 0 : 1, true);
      }
    });
    render(value, 0);
    return { set: setValue };
  }

  /* ================= 风的界面 ================= */
  var SPEED_STOPS = [0, 0.25, 0.5, 0.75, 1];
  var SPEED_WORDS = [[0, "无风"], [0.25, "微风"], [0.5, "清风"], [0.75, "强风"], [1, "大风"]];

  /* ================= 风向袋 ================= */
  function drawWindsock() {}

  /* ================= 指针 ================= */
  var drag = null;

  function pointFor(e) {
    var sr = scene.getBoundingClientRect();
    if (!sr.width || !sr.height) return null;
    return {
      p: plant,
      x: (e.clientX - sr.left) / sr.width * SC_W - PAD_X,
      y: (e.clientY - sr.top) / sr.height * SC_H - PAD_Y
    };
  }
  function hitsPlant(p, x, y) {
    for (var i = 0; i < p.joints.length; i++) {
      var j = p.joints[i];
      if (Math.abs(j.wx - x) < 9 && Math.abs(j.wy - y) < 11) return true;
    }
    for (var c = 0; c < p.clusters.length; c++) {
      var cl = p.clusters[c];
      if (cl.state !== "on") continue;
      var pos = plantX(p, cl);
      if (Math.abs(pos.x - x) < 9 && Math.abs(pos.y - y) < 9) return true;
    }
    return false;
  }
  function tryGrab(p, x, y) {
    var best = -1, bd = 1e9;
    for (var i = 0; i < p.joints.length; i++) {
      var j = p.joints[i];
      if (j.parent < 0) continue;
      var d = Math.hypot(j.wx - x, j.wy - y);
      if (d < bd) { bd = d; best = i; }
    }
    if (best < 0 || bd > 17) return null;
    return { plant: p, joint: best, startX: x, startY: y };
  }

  function onDown(e) {
    var hit = pointFor(e);
    if (!hit) return;
    var grab = tryGrab(hit.p, hit.x, hit.y);
    if (grab) {
      drag = grab;
      scene.setPointerCapture(e.pointerId);
      scene.dataset.over = "grab";
      return;
    }
    if (!hitsPlant(hit.p, hit.x, hit.y)) return;
    /* 点一下掉一批，连点越掉越多 */
    var td = performance.now() / 1000;
    shakePlant(hit.p, hit.x, hit.y, td, tapBurst(td));
  }
  function onMove(e) {
    if (drag) {
      var hit = pointFor(e);
      if (!hit || hit.p !== drag.plant) return;
      if (Math.hypot(hit.x - drag.startX, hit.y - drag.startY) > 2) drag.moved = true;
      var j = drag.plant.joints[drag.joint], par = drag.plant.joints[j.parent];
      var target = Math.atan2(hit.x - par.rx, -(hit.y - par.ry));
      var delta = target - Math.atan2(j.dx, -j.dy);
      while (delta > Math.PI) delta -= Math.PI * 2;
      while (delta < -Math.PI) delta += Math.PI * 2;
      /* 越靠下的关节越不该被甩：拖主干只让它微微倾，拖枝梢才允许大弯，
         否则整棵树会被甩出画布，看起来像被硬边切掉 */
      var lim = clamp(0.75 * (drag.plant.spec.baseY - j.wy) / 150, 0.16, 0.7);
      drag.plant.drag = { joint: drag.joint, angle: clamp(delta, -lim, lim) };
      return;
    }
    var hover = pointFor(e);
    scene.dataset.over = hover && hitsPlant(hover.p, hover.x, hover.y) ? "plant" : "";
  }
  function onUp(e) {
    if (!drag) return;
    var p = drag.plant;
    p.drag = null;
    var hit = pointFor(e);
    if (drag.moved && hit && hit.p === p) {
      p.events.push({ x: hit.x, y: hit.y, t0: performance.now() / 1000, power: 0.032 });
      var tu = performance.now() / 1000;
      shakePlant(p, hit.x, hit.y, tu, tapBurst(tu));
    } else {
      p.events.push({ x: drag.startX, y: drag.startY, t0: performance.now() / 1000, power: 0.05 });
      var tu2 = performance.now() / 1000;
      shakePlant(p, drag.startX, drag.startY, tu2, tapBurst(tu2));
    }
    drag = null;
    scene.dataset.over = "";
  }

  scene.addEventListener("pointerdown", onDown);
  scene.addEventListener("pointermove", onMove);
  scene.addEventListener("pointerup", onUp);
  scene.addEventListener("pointercancel", onUp);

  /* ================= 工作台：按键开合 ================= */
  var dockWrap = document.getElementById("dockWrap");

  function placeGrow(open) {

    dockBtn.setAttribute("title", open ? "收起工作台" : "工作台");

  });

  /* ================= 重新开花 ================= */
  function updateGrow() {
    growBtn.hidden = remaining(plant) > 0;
  }
  growBtn.addEventListener("click", function () {
    regrow(plant, performance.now() / 1000);
    growBtn.hidden = true;
  });

  /* ================= 启动 ================= */
  window.addEventListener("resize", function () {
    layout();
    if (dockWrap.getAttribute("data-open") === "true") placeGrow(true);
  });
  document.addEventListener("visibilitychange", function () { lastT = 0; });

  refreshColors();
  /* 手机浏览器打开就落在夜晚海边（一屏就好看，不用自己先切两下）；
     桌面保持原来的浅色 + 纯色，什么都不动 */
  if (frame.dataset.embed !== "true" && isPhoneScreen()) {
    state.theme = "dark";
    state.bg = "sea";
    frame.dataset.theme = "dark";
    frame.dataset.bg = "sea";
    applyPalette(true);
    plant = buildPlant(SPEC);
    drawThemeIcon();
    backForce = true;
  }
  /* 开场就是一层微风，从左侧往右吹：树轻轻偏着、花往右边飘，一眼就知道风是活的。
     wind.manual 仍为假 —— 只有用户自己动过风速，风才会把花吹秃 */
  wind.set({ direction: 1, strength: PRESETS[state.preset].strength, gusts: PRESETS[state.preset].gusts });
  wind.manual = false;
  syncWindUI();
  layout();

  /* 开屏不留预置的半空花瓣：自然落瓣会自己慢慢飘下来 */

  statusEl.textContent = "正在长树";
  requestAnimationFrame(loop);
  setTimeout(updateGrow, 500);
})();
</script>
</body>
</html>
