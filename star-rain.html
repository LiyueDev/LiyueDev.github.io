<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>把雨接成星光</title>
<script>
/* 在样式生效前就判定 embed：类落在 documentElement 上，后面的脚本即使出错，
   预览卡里也不会露出顶栏和面板，也不会闪一下 */
(function () {
  if (/(?:^|[?&])embed(?:=1)?(?:&|$)/.test(location.search)) {
    document.documentElement.classList.add('is-embed');
  }
})();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #050e26; overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }

  /* ============ 顶栏 / 设置栏（与 wind-tree 同一套控件语言） ============ */
  :root {
    --ink: #edf2fa; --subtle: #a3b1c8; --faint: #78869e;
    --edge: #3a475f; --edge-2: rgba(160, 196, 255, .18);
    --icon-tile: rgba(34, 44, 62, .72);
    --rail: #3a475f; --fill: #6a9bff; --fill-2: #85aeff; --thumb: #edf2fa;
    --focus: rgba(106, 155, 255, .55);
    --shadow: 0 22px 60px -24px rgba(0, 0, 0, .62), 0 10px 28px -12px rgba(0, 0, 0, .42);
    --sep: rgba(163, 177, 200, .14);
  }

  /* 顶栏：不满铺，只两个角上的浮钮 */
  .pp-top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    -webkit-user-select: none; user-select: none;
    pointer-events: none;
  }
  .pp-top-start, .pp-top-end { display: flex; align-items: center; gap: 8px; pointer-events: auto; }

  .pp-icon {
    display: grid; place-items: center; width: 36px; height: 36px; padding: 0;
    border: 0; border-radius: 10px; background: transparent;
    color: var(--subtle); cursor: pointer; text-decoration: none; font: inherit;
    touch-action: manipulation;
    transition: color .2s cubic-bezier(.22, .61, .36, 1),
                background .2s cubic-bezier(.22, .61, .36, 1),
                transform .18s cubic-bezier(.22, .61, .36, 1);
  }
  .pp-icon:hover, .pp-icon[aria-expanded="true"] {
    color: var(--ink); background: var(--icon-tile); box-shadow: inset 0 0 0 1px var(--edge-2);
  }
  .pp-icon:active { transform: scale(.94); }
  .pp-icon:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .wt-sign {
    display: block; padding: 4px; border-radius: 10px; opacity: .6;
    transition: opacity .2s ease, background .2s ease;
  }
  .wt-sign img { display: block; height: 22px; width: auto; }
  .wt-sign:hover { opacity: 1; background: var(--icon-tile); }

  /* 设置面板：默认收起，从设置键下沿展开 */
  #panel {
    position: fixed; top: 64px; left: 20px; z-index: 31;
    width: min(292px, calc(100vw - 40px));
    padding: 16px 18px 14px; border-radius: 18px;
    background: linear-gradient(180deg, rgba(39, 50, 70, .94) 0%, rgba(34, 44, 62, .96) 100%);
    box-shadow: 0 0 0 1px var(--edge), var(--shadow);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    color: var(--ink);
    font: 400 12px/1.45 "Noto Sans SC", "PingFang SC", "Microsoft YaHei", -apple-system, system-ui, sans-serif;
    transform-origin: top left;
    transition: opacity .24s cubic-bezier(.22, .61, .36, 1),
                transform .24s cubic-bezier(.22, .61, .36, 1);
  }
  #panel[data-open="false"] { opacity: 0; transform: translateY(-6px) scale(.96); pointer-events: none; }

  .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
  .hd .t { font-size: 12px; font-weight: 600; letter-spacing: .02em; }
  .hd .t::before {
    content: ""; display: inline-block; width: 3px; height: 3px; border-radius: 50%;
    background: var(--fill-2); margin-right: 7px; vertical-align: 2px; opacity: .9;
  }
  #resetBtn {
    border: 0; background: none; padding: 2px 0; cursor: pointer;
    font: inherit; font-size: 11px; color: var(--faint); transition: color .2s;
  }
  #resetBtn:hover { color: var(--ink); }

  .field { display: grid; gap: 7px; }
  .field + .field { margin-top: 14px; }
  .pp-label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; color: var(--subtle); font-size: 12px; }
  .pp-value { color: var(--ink); font-weight: 600; font-size: 13px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  #dirArrow { display: inline-block; width: 13px; text-align: center; font-size: 12px; color: var(--fill-2); transition: transform .12s linear; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    display: block; width: 100%; height: 22px; margin: 0; background: transparent;
    cursor: pointer; touch-action: none;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 999px;
    background: linear-gradient(90deg,
      var(--fill) 0%,
      var(--fill-2) var(--fillp, 50%),
      var(--rail) var(--fillp, 50%),
      var(--rail) 100%);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; margin-top: -7.5px; border-radius: 50%;
    background: var(--thumb);
    box-shadow: 0 3px 10px -2px rgba(0, 0, 0, .55), 0 0 0 1px var(--edge);
    transition: box-shadow .18s ease;
  }
  input[type="range"]:hover::-webkit-slider-thumb,
  input[type="range"]:focus-visible::-webkit-slider-thumb {
    box-shadow: 0 0 0 3px var(--focus), 0 3px 10px -2px rgba(0, 0, 0, .5);
  }
  input[type="range"]::-moz-range-track { height: 3px; border-radius: 999px; background: var(--rail); }
  input[type="range"]::-moz-range-progress { height: 3px; border-radius: 999px; background: linear-gradient(90deg, var(--fill), var(--fill-2)); }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px; border: 0; border-radius: 50%; background: var(--thumb);
    box-shadow: 0 3px 10px -2px rgba(0, 0, 0, .55), 0 0 0 1px var(--edge);
  }

  .ft {
    margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--sep);
    font-size: 10.5px; color: var(--faint); letter-spacing: .02em;
  }

  @media (max-width: 760px) {
    .pp-top {
      padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
               10px calc(14px + env(safe-area-inset-left));
    }
    .pp-icon { width: 42px; height: 42px; border-radius: 12px; }
    .pp-icon svg { width: 22px; height: 22px; }
    .wt-sign { display: none; }

    #panel {
      top: calc(64px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
      right: calc(12px + env(safe-area-inset-right));
      width: auto;
      max-height: calc(100vh - 84px - env(safe-area-inset-top));
      max-height: calc(100dvh - 84px - env(safe-area-inset-top));
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 16px 18px 14px;
      border-radius: 20px;
      font-size: 13px;
    }
    .hd { margin-bottom: 16px; }
    .hd .t { font-size: 13px; }
    #resetBtn { font-size: 12px; }
    .pp-label { font-size: 13px; }
    .pp-value { font-size: 15px; }
    .field + .field { margin-top: 16px; }
    .field { gap: 9px; }

    /* 触控尺寸放大：轨道更粗、滑块更大、整行更好按 */
    input[type="range"] { height: 30px; }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; }
    input[type="range"]::-webkit-slider-thumb { width: 20px; height: 20px; margin-top: -8px; }
    input[type="range"]::-moz-range-track { height: 4px; }
    input[type="range"]::-moz-range-progress { height: 4px; }
    input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; }

    .ft { font-size: 11px; }
  }

  /* 横屏手机：面板别把整个画面吃掉 */
  @media (max-height: 460px) {
    #panel {
      max-height: calc(100dvh - 64px - env(safe-area-inset-top));
    }
    .pp-top { padding-top: calc(8px + env(safe-area-inset-top)); }
  }

  /* 嵌进主页预览卡时只留场景 */
  html.is-embed .pp-top,
  html.is-embed #panel { display: none !important; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<header class="pp-top">
  <div class="pp-top-start">
    <a class="pp-icon" href="index.html" aria-label="回到 liyue 的主页" title="回到主页">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M14.8 4.6 7.4 12l7.4 7.4" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <button class="pp-icon" id="dockBtn" type="button" aria-label="打开设置"
            aria-expanded="false" aria-controls="panel" title="设置（H 键开合）">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
        <path d="M4 6H7.1M10.9 6H20M4 12H13.1M16.9 12H20M4 18H6.6M10.4 18H20"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="9" cy="6" r="1.9" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="15" cy="12" r="1.9" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="8.5" cy="18" r="1.9" fill="none" stroke="currentColor" stroke-width="1.6"/>
      </svg>
    </button>
  </div>
  <div class="pp-top-end">
    <a class="wt-sign" href="index.html" aria-label="liyue 的作品集" title="liyue">
      <img src="assets/sign-white.png" alt="liyue 的签名" />
    </a>
  </div>
</header>

<div id="panel" data-open="false">
  <div class="hd">
    <span class="t">场景设置</span>
    <button id="resetBtn" type="button">重置</button>
  </div>

  <div class="field">
    <div class="pp-label"><span>风向</span><span class="pp-value"><i id="dirArrow">→</i>&nbsp;<b id="dirVal">0°</b></span></div>
    <input type="range" id="dir" min="-180" max="180" step="1" value="0" aria-label="风向">
  </div>

  <div class="field">
    <div class="pp-label"><span>风速</span><span class="pp-value"><b id="spdVal">42</b></span></div>
    <input type="range" id="speed" min="0" max="100" step="1" value="42" aria-label="风速">
  </div>

  <div class="field">
    <div class="pp-label"><span>雨密度</span><span class="pp-value"><b id="denVal">62%</b></span></div>
    <input type="range" id="density" min="0" max="100" step="1" value="62" aria-label="雨密度">
  </div>

  <div class="field">
    <div class="pp-label"><span>下落速度</span><span class="pp-value"><b id="fallVal">×1.0</b></span></div>
    <input type="range" id="fall" min="0.5" max="2" step="0.05" value="1" aria-label="下落速度">
  </div>

  <div class="ft">拖到最右可停雨 · H 键或 Esc 收起</div>
</div>
<script>
(function () {
  const cv  = document.getElementById('stage');
  const ctx = cv.getContext('2d');

  let W = 0, H = 0, dpr = 1;
  let bgGrad = null, groundGrad = null;

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

  /* ============ 可调参数（设置栏） ============ */
  const DEFAULTS = { dir: 0, speed: 42, density: 62, fall: 1 };
  const cfg = Object.assign({}, DEFAULTS);
  const STORE_KEY = 'star-rain-cfg';

  const uiEl = {
    dir:     document.getElementById('dir'),
    speed:   document.getElementById('speed'),
    density: document.getElementById('density'),
    fall:    document.getElementById('fall')
  };
  const outEl = {
    dir:     document.getElementById('dirVal'),
    speed:   document.getElementById('spdVal'),
    density: document.getElementById('denVal'),
    fall:    document.getElementById('fallVal')
  };
  const dirArrow = document.getElementById('dirArrow');

  // 密度 → 上限（0 表示一滴都没有）。按屏幕面积折一下，手机上不至于糊成一片
  const screenScale = () => clamp((W * H) / (1000 * 760), .55, 1.25);
  const rainCap  = () => Math.round(cfg.density * 9 * screenScale());
  const sparkCap = () => Math.round(cfg.density * 3.5 * screenScale());

  /* ============ 五角星路径 ============ */
  const starPath = new Path2D();
  for (let i = 0; i < 10; i++) {
    const r = (i % 2 === 0) ? 1 : 0.42;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const px = Math.cos(a) * r, py = Math.sin(a) * r;
    if (i === 0) starPath.moveTo(px, py); else starPath.lineTo(px, py);
  }
  starPath.closePath();

  /* ============ 布局 ============ */
  const umb = { a: 0, b: 0, cx: 0, cy: 0, baseX: 0, topY: 0 };

  function layout() {
    // 窄屏（手机竖屏）伞要占更宽的比例，否则在大屏高里显得很小
    const narrow = W < 640;
    const short  = H < 480;
    umb.a     = narrow ? Math.min(W * 0.32, 170) : Math.min(W * 0.19, 230);
    umb.a     = Math.min(umb.a, H * 0.42);      // 短屏（横屏手机）别顶到地平线
    umb.b     = umb.a * 0.78;      // 略扁，更像伞
    umb.topY  = H * (short ? 0.36 : (narrow ? 0.44 : 0.40));
    umb.baseX = W * 0.5;
    umb.cx    = umb.baseX;         // 伞不晃，始终居中
    umb.cy    = umb.topY + umb.b;
  }

  /* 弧形地平线（行星表面） */
  function groundY(x) {
    const dx = (x - W * 0.5) / (W * 0.55);
    return H * 0.855 - dx * dx * H * 0.075;
  }

  /* ============ 背景星点 ============ */
  let bgStars = [];
  function buildStars() {
    bgStars = [];
    const n = Math.round((W * H) / 12000);
    for (let i = 0; i < n; i++) {
      bgStars.push({
        x: rand(0, W),
        y: rand(0, H * 0.78),
        r: rand(.7, 2.4),
        tw: rand(.0008, .0026),
        ph: rand(0, Math.PI * 2),
        gold: Math.random() < .18
      });
    }
  }

  /* ============ 雨 ============ */
  const rain = [];
  const sparks = [];

  let t = 0;
  let dripTimer = 0;

  /* 风：方向由设置栏控制，强弱带一点阵风起伏 */
  function windAt(now) {
    const gust = .9 + .22 * Math.sin(now * .00062) + .12 * Math.sin(now * .0019 + 1.7);
    const rad  = cfg.dir * Math.PI / 180;
    return {
      x: Math.cos(rad) * cfg.speed * gust,
      y: Math.sin(rad) * cfg.speed * gust * .32
    };
  }

  function spawnRain() {
    // 亮度随机：多数偏暗，少数很亮
    const bright = Math.random();
    let a, w, big;
    if (bright > .93) { a = 1; w = rand(1.6, 2.4); big = true; }
    else if (bright > .62) { a = rand(.55, .85); w = rand(1, 1.6); big = false; }
    else { a = rand(.12, .42); w = rand(.6, 1.1); big = false; }

    rain.push({
      x: rand(-W * .3, W * 1.25),
      y: rand(-H * .35, -8),
      vx: rand(-40, 60),
      vy: rand(90, 220) * cfg.fall,
      a, w, big: big,
      len: rand(.7, 1.5),
      star: Math.random() < .12        // 少数是星形雨点
    });
  }

  /* ============ 伞面碰撞（椭圆球冠） ============ */
  function hitUmbrella(p) {
    const a = umb.a, b = umb.b;
    if (p.y > umb.cy) return false;                    // 只挡上半面
    const X = (p.x - umb.cx) / a;
    const Y = (p.y - umb.cy) / b;
    const d = Math.hypot(X, Y);
    if (d > 1.08 || d < 0.2) return false;

    // 椭圆法线
    let nx = X / a, ny = Y / b;
    const nl = Math.hypot(nx, ny) || 1;
    nx /= nl; ny /= nl;

    // 推回伞面外
    const ux = X / (d || 1), uy = Y / (d || 1);
    p.x = umb.cx + ux * a + nx * 1.5;
    p.y = umb.cy + uy * b + ny * 1.5;

    const vn = p.vx * nx + p.vy * ny;
    if (vn < 0) {
      // 消掉向内的法向分量 —— 雨就顺着伞面滑下去
      p.vx -= vn * nx * 1.15;
      p.vy -= vn * ny * 1.15;
    }
    p.vx *= .985;
    p.vy *= .985;

    // 撞击处溅起星光（沿伞面法线弹开）
    if (Math.random() < .9) splashStars(p.x, p.y, Math.round(rand(2, 4)), nx, ny);
    p.attached = true;
    return true;
  }

  /* ============ 星光散开 ============ */
  function splashStars(x, y, n, nx = 0, ny = 0) {
    for (let i = 0; i < n; i++) {
      if (sparks.length >= sparkCap()) return;
      const ang = rand(-Math.PI * 1.18, Math.PI * .18);
      const sp  = rand(35, 150);
      const life = rand(.45, 1.0);
      sparks.push({
        x, y,
        // 沿伞面法线弹开，再叠加随机方向
        vx: Math.cos(ang) * sp + nx * rand(15, 60),
        vy: Math.sin(ang) * sp + ny * rand(15, 60),
        age: 0, life,
        size: rand(2.0, 4.6),
        rot: rand(0, Math.PI),
        spin: rand(-7, 7),
        gold: Math.random() < .6
      });
    }
  }

  /* ============ 主更新 ============ */
  function update(dt) {
    t += dt * 1000;

    // 伞固定在正中，不随风摆动

    // 补充雨
    const cap = rainCap();
    if (rain.length < cap) {
      const need = Math.min(10, Math.ceil((cap - rain.length) / 12) + 1);
      for (let i = 0; i < need; i++) spawnRain();
    }

    // 伞沿积水，不断往下滴
    dripTimer -= dt;
    if (dripTimer <= 0 && cfg.density > 0) {
      dripTimer = rand(.18, .5);
      const side = Math.random() < .5 ? -1 : 1;
      const dx = umb.cx + side * umb.a * rand(1.06, 1.16);
      rain.push({
        x: dx, y: umb.cy + rand(2, 14),
        vx: rand(-6, 8), vy: rand(30, 70),
        a: rand(.5, 1), w: rand(.9, 1.5), big: Math.random() < .3,
        len: rand(.8, 1.3), star: false, attached: false
      });
    }

    const wind = windAt(t);

    for (let i = rain.length - 1; i >= 0; i--) {
      const p = rain[i];
      p.vy += 300 * cfg.fall * dt;      // 重力
      // 风：水平速度朝风向收敛，风越大雨丝越斜
      const tx = wind.x * 1.8;
      p.vx += (tx - p.vx) * Math.min(1, 2.2 * dt);
      p.vy += wind.y * .45 * dt;        // 竖直分量，弱一些
      p.vx = clamp(p.vx, -260, 260);

      // 两个子步，避免高速穿透伞面
      let hitSomething = false;
      for (let s = 0; s < 2; s++) {
        p.x += p.vx * dt * .5;
        p.y += p.vy * dt * .5;

        if (hitUmbrella(p)) { hitSomething = true; break; }

        // 已经离开伞面的雨滴恢复自由下落
        if (p.attached) {
          const ex = (p.x - umb.cx) / umb.a;
          const ey = (p.y - umb.cy) / umb.b;
          if (Math.hypot(ex, ey) > 1.12) p.attached = false;
        }

        // 雨在伞面上滑过时，留下流动的星屑（把雨变成星光的过程）
        if (p.attached) {
          p.trail = (p.trail || 0) + Math.hypot(p.vx, p.vy) * dt * .5;
          if (p.trail > 26 && sparks.length < sparkCap()) {
            p.trail = 0;
            sparks.push({
              x: p.x, y: p.y,
              vx: p.vx * .25 + rand(-8, 8),
              vy: p.vy * .25 + rand(-8, 8),
              age: 0, life: rand(.3, .55),
              size: rand(1.1, 2.0),
              rot: rand(0, Math.PI),
              spin: rand(-3, 3),
              gold: true
            });
          }
        }

        if (p.y > groundY(p.x)) {
          splashStars(p.x, groundY(p.x) - 2, 3);   // 落地：碎成小星星
          hitSomething = true;
          break;
        }
      }

      const out = p.x < -W * .3 || p.x > W * 1.3 || p.y > H + 40;
      if (hitSomething && p.y > groundY(p.x)) { rain.splice(i, 1); continue; }
      if (out) rain.splice(i, 1);
    }

    // 星光
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.age += dt;
      if (s.age >= s.life) { sparks.splice(i, 1); continue; }
      s.vy += 140 * dt;
      s.vx *= (1 - 1.6 * dt);
      s.vy *= (1 - 1.1 * dt);
      s.vx += wind.x * .3 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.rot += s.spin * dt;
    }
  }

  /* ============ 绘制 ============ */
  function drawSky() {
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // 星点
    for (const s of bgStars) {
      const a = .25 + .55 * (.5 + .5 * Math.sin(t * s.tw + s.ph));
      ctx.globalAlpha = a;
      ctx.fillStyle = s.gold ? '#FFE9A3' : '#FFFFFF';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 地平线
    const gy0 = groundY(W * .5);
    const gg = ctx.createLinearGradient(0, gy0, 0, H);
    gg.addColorStop(0, '#1a3a68');
    gg.addColorStop(.18, '#122f5a');
    gg.addColorStop(1, '#061530');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 12) ctx.lineTo(x, groundY(x));
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // 银河：一条很淡的斜向光带（边缘全透明，避免硬边）
    ctx.save();
    ctx.translate(W * .5, H * .34);
    ctx.rotate(-.38);
    const band = ctx.createLinearGradient(0, -H * .17, 0, H * .17);
    band.addColorStop(0,   'rgba(130,168,240,0)');
    band.addColorStop(.5,  'rgba(140,178,250,.075)');
    band.addColorStop(1,   'rgba(130,168,240,0)');
    ctx.fillStyle = band;
    ctx.fillRect(-W * .8, -H * .17, W * 1.6, H * .34);
    ctx.restore();

    // 地平线的一道光
    ctx.beginPath();
    for (let x = 0; x <= W; x += 12) {
      const y = groundY(x);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(206,226,255,.42)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  function drawRain() {
    for (const p of rain) {
      const sp = Math.hypot(p.vx, p.vy) || 1;
      const len = Math.min(sp * .055 * p.len, 44);
      const nx = p.vx / sp, ny = p.vy / sp;

      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - nx * len, p.y - ny * len);
      ctx.strokeStyle = p.big
        ? `rgba(255,240,200,${p.a})`
        : `rgba(220,235,255,${p.a})`;
      ctx.lineWidth = p.w;
      ctx.lineCap = 'round';
      ctx.stroke();

      if (p.star) {
        // 个别雨点是星形，落下来像流星屑
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(p.w * 1.6, p.w * 1.6);
        ctx.globalAlpha = p.a;
        ctx.fillStyle = '#FFF3C4';
        ctx.fill(starPath);
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawUmbrella() {
    const { a, b, cx, cy } = umb;
    const seg = 6;                       // 6 个等分伞面

    ctx.save();

    /* 伞面：上半椭圆弧 + 平直底边，平涂、无渐变 */
    ctx.beginPath();
    ctx.ellipse(cx, cy, a, b, 0, Math.PI, Math.PI * 2);
    ctx.closePath();                     // 闭合即一条笔直的伞沿
    ctx.fillStyle = 'rgba(9,24,50,.84)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(216,235,255,.8)';
    ctx.lineWidth = 1.1;
    ctx.lineJoin = 'round';
    ctx.stroke();

    /* 伞骨：顶点到伞沿的直线，等分伞面 */
    ctx.strokeStyle = 'rgba(190,218,255,.30)';
    ctx.lineWidth = 1;
    for (let i = 1; i < seg; i++) {
      const x = cx - a + (2 * a) * (i / seg);
      ctx.beginPath();
      ctx.moveTo(cx, cy - b);
      ctx.lineTo(x, cy);
      ctx.stroke();
    }

    /* 伞尖：一小段竖线 */
    ctx.strokeStyle = 'rgba(212,234,255,.58)';
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy - b - 6);
    ctx.lineTo(cx, cy - b + 1);
    ctx.stroke();

    /* 伞柄与挂钩：别插进地平线 */
    const handleBottom = Math.max(cy + 28, Math.min(cy + H * .105, groundY(cx) - 18));
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx, handleBottom);
    ctx.strokeStyle = 'rgba(202,226,255,.42)';
    ctx.lineWidth = 1.3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx - 9, handleBottom, 9, 0, Math.PI);
    ctx.stroke();

    ctx.restore();
  }

  /* 贴在伞面上滑落的雨珠：画在伞的前面，能看见它们往下滚 */
  function drawAttached() {
    for (const p of rain) {
      if (!p.attached) continue;
      const sp = Math.hypot(p.vx, p.vy) || 1;
      const nx = p.vx / sp, ny = p.vy / sp;
      const len = Math.min(sp * .05, 22);

      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - nx * len, p.y - ny * len);
      ctx.strokeStyle = `rgba(255,245,215,${p.a * .9})`;
      ctx.lineWidth = p.w * .9;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.w * .9, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,250,235,${p.a})`;
      ctx.fill();
    }
  }

  function drawSparks() {
    for (const s of sparks) {
      const a = 1 - s.age / s.life;
      const sp = Math.hypot(s.vx, s.vy) || 1;
      const tl = Math.min(sp * .09, 34);
      const nx = s.vx / sp, ny = s.vy / sp;

      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - nx * tl, s.y - ny * tl);
      ctx.strokeStyle = `rgba(255,240,200,${a * .35})`;
      ctx.lineWidth = Math.max(s.size * .22, .5);
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.scale(s.size, s.size);
      ctx.globalAlpha = a * .95;
      ctx.fillStyle = s.gold ? '#FFE9A3' : '#FFFFFF';
      ctx.fill(starPath);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  /* ============ 循环 ============ */
  let last = 0, rafId = null;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;

    update(dt);

    ctx.clearRect(0, 0, W, H);
    drawSky();
    drawRain();          // 雨先落
    drawUmbrella();      // 伞把它挡住
    drawAttached();      // 顺着伞面滚落的雨珠
    drawSparks();        // 星光在最前

    rafId = requestAnimationFrame(frame);
  }

  /* ============ 启动 ============ */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width  = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    cv.style.width  = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#040c22');
    bgGrad.addColorStop(.42, '#0a1b3f');
    bgGrad.addColorStop(.72, '#0e2751');
    bgGrad.addColorStop(1, '#081a38');

    layout();
    buildStars();
  }

  /* ============ 设置栏交互 ============ */
  function paintTrack(input) {
    const min = +input.min, max = +input.max;
    input.style.setProperty('--fillp', ((+input.value - min) / (max - min) * 100) + '%');
  }

  function readCfg() {
    cfg.dir     = +uiEl.dir.value;
    cfg.speed   = +uiEl.speed.value;
    cfg.density = +uiEl.density.value;
    cfg.fall    = +uiEl.fall.value;
  }

  function renderUI() {
    uiEl.dir.value     = cfg.dir;
    uiEl.speed.value   = cfg.speed;
    uiEl.density.value = cfg.density;
    uiEl.fall.value    = cfg.fall;

    Object.keys(uiEl).forEach(k => paintTrack(uiEl[k]));

    outEl.dir.textContent     = Math.round(cfg.dir) + '°';
    outEl.speed.textContent   = Math.round(cfg.speed);
    outEl.density.textContent = Math.round(cfg.density) + '%';
    outEl.fall.textContent    = '×' + (Math.round(cfg.fall * 100) / 100).toFixed(2).replace(/0$/, '');
    dirArrow.style.transform  = 'rotate(' + cfg.dir + 'deg)';
  }

  function saveCfg() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch (e) {}
  }

  function loadCfg() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (saved && typeof saved === 'object') {
        for (const k in DEFAULTS) {
          if (typeof saved[k] === 'number' && isFinite(saved[k])) cfg[k] = saved[k];
        }
      }
    } catch (e) {}
  }

  Object.keys(uiEl).forEach(k => {
    uiEl[k].addEventListener('input', () => { readCfg(); renderUI(); saveCfg(); });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    Object.assign(cfg, DEFAULTS);
    renderUI();
    saveCfg();
  });

  const panel = document.getElementById('panel');
  const dockBtn = document.getElementById('dockBtn');

  function setPanel(open) {
    panel.dataset.open = open ? 'true' : 'false';
    dockBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  // 默认收起，只有点设置键 / H 键才展开
  setPanel(false);

  dockBtn.addEventListener('click', e => {
    e.stopPropagation();
    setPanel(panel.dataset.open !== 'true');
  });

  // 点场景、点空白处收起
  cv.addEventListener('pointerdown', () => setPanel(false));

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { setPanel(false); return; }
    if (e.key && e.key.toLowerCase() === 'h' && !e.metaKey && !e.ctrlKey && !e.altKey) {
      setPanel(panel.dataset.open !== 'true');
    }
  });

  // 在主页预览卡里（?embed=1）只留场景，不出顶栏和面板
  if (/(?:^|[?&])embed(?:=1)?(?:&|$)/.test(location.search)) {
    document.body.classList.add('is-embed');
    setPanel(false);
    // 直接把外壳摘掉：不只靠样式覆盖，缓存了旧状态或被别的东西改了 data-open 也不会露出来
    const top = document.querySelector('.pp-top');
    if (top) top.remove();
    panel.remove();
  }

  window.addEventListener('resize', resize);
  resize();

  loadCfg();
  renderUI();

  // 预铺一层雨，打开就有密度
  const seedN = Math.round(rainCap() * .45);
  for (let i = 0; i < seedN; i++) {
    spawnRain();
    const p = rain[rain.length - 1];
    p.y = rand(-H * .2, H * .75);
  }

  last = performance.now();
  rafId = requestAnimationFrame(frame);

  /* 调试：?snap=1 把画面转成图片盖在页面上（无头截图用） */
  if (location.search.indexOf('snap') > -1) {
    setTimeout(() => {
      const img = new Image();
      img.src = cv.toDataURL();
      img.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;z-index:99';
      document.body.appendChild(img);
    }, 1400);
  }
})();
</script>
</body>
</html>
